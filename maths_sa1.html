/* =========================================================================
   PART 1: SMALL HELPER FUNCTIONS THAT BUILD QUESTIONS
   Instead of typing out every single question by hand, we give the computer
   pairs of numbers (like [682, 120]) and a helper writes the question and
   works out the right answer itself. This is much less typing and fewer
   mistakes than writing 350+ questions one at a time!
   ========================================================================= */
let uid = 0;
function nextId(prefix){ uid++; return prefix + "-" + uid; }

function subQ(a, b){
  return { id:nextId("q"), type:"short", prompt:`${a} − ${b} = ?`, answer:[String(a-b)],
    explain:`${a} − ${b} = ${a-b}.` };
}
function mulQ(a, b){
  return { id:nextId("q"), type:"short", prompt:`${a} × ${b} = ?`, answer:[String(a*b)],
    explain:`${a} × ${b} = ${a*b}.` };
}
function divQ(a, b, withR){
  const q = Math.floor(a/b), r = a % b;
  if(withR){
    return { id:nextId("q"), type:"fill", ordered:true, labels:["Quotient","Remainder"],
      prompt:`Divide: ${a} ÷ ${b}. Find the quotient and the remainder.`,
      answer:[String(q), String(r)], explain:`${a} ÷ ${b} = ${q} remainder ${r}.` };
  }
  return { id:nextId("q"), type:"short", prompt:`${a} ÷ ${b} = ?`, answer:[String(q)],
    explain:`${a} ÷ ${b} = ${q}.` };
}
function makeSub(pairs){ return pairs.map(p=>subQ(p[0],p[1])); }
function makeMul(pairs){ return pairs.map(p=>mulQ(p[0],p[1])); }
function makeDiv(pairs, withR){ return pairs.map(p=>divQ(p[0],p[1],withR)); }
function short(prompt, answers, explain){
  return { id:nextId("q"), type:"short", prompt, answer:answers, explain };
}
function mcq(prompt, options, answer, explain){
  return { id:nextId("q"), type:"mcq", prompt, options, answer, explain };
}
function multi(prompt, options, answer, explain){
  return { id:nextId("q"), type:"multi", prompt, options, answer, explain };
}
function fill(prompt, labels, answers, ordered, explain){
  return { id:nextId("q"), type:"fill", ordered:ordered!==false, prompt, labels, answer:answers, explain };
}
function text(prompt, sample){
  return { id:nextId("q"), type:"text", prompt, sample };
}

/* =========================================================================
   PART 3: SAVING PROGRESS (the "Rejoin Code" feature) — same idea as before.
   Progress is saved per-exercise, so you can stop after Exercise 3A today
   and pick up at 3B tomorrow, all under one code.
   ========================================================================= */
const STORAGE_KEY = "mathsBookSession";
function makeCode(){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let code = ""; for(let i=0;i<6;i++){ code += chars[Math.floor(Math.random()*chars.length)]; }
  return code;
}
function saveSession(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function loadSession(){ try{ const raw = localStorage.getItem(STORAGE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }

/* state.exercises[exId] = { index:0, answers:{}, submitted:false } */
let state = { code:null, exercises:{} };
const app = document.getElementById("app");

function getExState(exId){
  if(!state.exercises[exId]) state.exercises[exId] = { index:0, answers:{}, submitted:false };
  return state.exercises[exId];
}
function findExercise(exId){
  for(const ch of BOOK){ const ex = ch.exercises.find(e=>e.id===exId); if(ex) return {ex, ch}; }
  return null;
}

function norm(s){ return (s||"").toString().trim().toLowerCase(); }
function escapeHtml(s){
  if(s===undefined || s===null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function checkAnswer(q, ans){
  switch(q.type){
    case "mcq": return { score:(ans===q.answer)?1:0, max:1 };
    case "short": {
      const ok = q.answer.some(a=>norm(a)===norm(ans));
      return { score: ok?1:0, max:1 };
    }
    case "multi": {
      const selected = ans||[];
      let sc=0;
      q.options.forEach(opt=>{
        const should = q.answer.includes(opt);
        const is = selected.includes(opt);
        if(should===is) sc++;
      });
      return { score:sc, max:q.options.length };
    }
    case "fill": {
      const userVals = (ans||[]).map(norm);
      const correctVals = q.answer.map(norm);
      let sc=0;
      if(q.ordered){
        correctVals.forEach((c,i)=>{ if(userVals[i]===c) sc++; });
      } else {
        const remaining=[...correctVals];
        userVals.forEach(u=>{ const idx=remaining.indexOf(u); if(idx>-1){ sc++; remaining.splice(idx,1); } });
      }
      return { score:sc, max:correctVals.length };
    }
    default: return null; // "text" reflections aren't scored
  }
}
function collectCurrentAnswer(q){
  switch(q.type){
    case "mcq": { const el = document.querySelector('input[name="r-'+q.id+'"]:checked'); return el?el.value:null; }
    case "short": { const el = document.getElementById("s-"+q.id); return el?el.value:""; }
    case "text": { const el = document.getElementById("t-"+q.id); return el?el.value:""; }
    case "multi": return q.options.filter((opt,i)=>{ const el=document.getElementById("m-"+q.id+"-"+i); return el && el.checked; });
    case "fill": return q.answer.map((_,i)=>{ const el=document.getElementById("f-"+q.id+"-"+i); return el?el.value:""; });
  }
  return null;
}

/* =========================================================================
   PART 5: SCREENS
   ========================================================================= */
function renderHome(){
  const saved = loadSession();
  if(saved && saved.code){ state = saved; }
  if(!state.code){
    // Brand-new visitor: create their code first, then render so it shows right away.
    state.code = makeCode();
    saveSession();
  }

  const banner = `<div class="session-box"><strong>Welcome!</strong> Your rejoin code is <span class="code-chip">${state.code}</span> — your progress on every exercise is saved automatically on this device.</div>`;
  const rejoinForm = `
      <div class="card">
        <h3>Switching devices? Enter a rejoin code</h3>
        <div style="display:flex; gap:8px;">
          <input type="text" id="rejoin-input" placeholder="e.g. AB3X9K" maxlength="6" style="text-transform:uppercase;">
          <button class="btn btn-ghost" onclick="tryRejoin()">Go</button>
        </div>
        <p id="rejoin-msg" style="margin-top:8px;"></p>
      </div>`;

  const chapterCards = BOOK.map(ch=>{
    let done=0, total=0;
    ch.exercises.forEach(ex=>{ const st=state.exercises[ex.id]; if(st && st.submitted) done++; total++; });
    return `<button class="chap-card" onclick="openChapter('${ch.id}')">
      <span class="emoji">${ch.emoji}</span> <strong>${ch.title}</strong>
      <div class="progress-label">${done} of ${total} exercises completed</div>
    </button>`;
  }).join("");

  app.innerHTML = `
    <div class="top"><div class="mascot">🧮</div><h1>Maths Practice Book</h1>
    <p>Subtraction, Multiplication, Division &amp; Fractions — practise one exercise at a time, just like in your workbook.</p></div>
    ${banner}
    ${rejoinForm}
    <div class="card"><h2>Choose a Chapter</h2>${chapterCards}</div>
    <div class="btn-row"><button class="btn btn-ghost btn-full" onclick="showOverallReport()">📊 See My Overall Report</button></div>
  `;
}

function tryRejoin(){
  const typed = document.getElementById("rejoin-input").value.trim().toUpperCase();
  const saved = loadSession();
  const msg = document.getElementById("rejoin-msg");
  if(saved && saved.code === typed){ state = saved; renderHome(); }
  else { msg.textContent = "We couldn't find that code on this device. Codes only work on the same device/browser you started on."; msg.style.color = "var(--bad)"; }
}

function openChapter(chId){
  const ch = BOOK.find(c=>c.id===chId);
  const exCards = ch.exercises.map(ex=>{
    const st = state.exercises[ex.id];
    let status = "Not started yet";
    if(st && st.submitted){
      let sc=0, mx=0;
      ex.questions.forEach(q=>{ const r=checkAnswer(q, st.answers[q.id]); if(r){ sc+=r.score; mx+=r.max; } });
      status = `Done — ${sc}/${mx}`;
    } else if(st && st.index>0){
      status = `In progress (question ${st.index+1} of ${ex.questions.length})`;
    }
    return `<div class="ex-card" onclick="openExercise('${ex.id}')">
      <div><div class="name">${ex.label}</div><div class="status">${status}</div></div>
      <div>${st && st.submitted ? "✅" : "▶"}</div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="top"><div class="mascot">${ch.emoji}</div><h1>${ch.title}</h1></div>
    <div class="card">${exCards}</div>
    <div class="btn-row"><button class="btn btn-ghost btn-full" onclick="renderHome()">← Back to Chapters</button></div>
  `;
}

function openExercise(exId){
  const st = getExState(exId);
  if(st.submitted){ renderExerciseResults(exId); } else { renderQuestion(exId); }
}

function renderQuestion(exId){
  const { ex, ch } = findExercise(exId);
  const st = getExState(exId);
  const q = ex.questions[st.index];
  const pct = Math.round((st.index)/ex.questions.length*100);

  let body = "";
  if(q.type==="mcq"){
    const savedVal = st.answers[q.id];
    body = q.options.map(opt=>{
      const checked = savedVal===opt ? "checked":"";
      return `<label class="option-btn ${savedVal===opt?'selected':''}">
        <input type="radio" name="r-${q.id}" value="${escapeHtml(opt)}" ${checked} style="margin-right:8px;" onchange="syncAndRerender('${exId}')">
        ${opt}</label>`;
    }).join("");
  } else if(q.type==="multi"){
    const savedVal = st.answers[q.id] || [];
    body = q.options.map((opt,i)=>{
      const checked = savedVal.includes(opt) ? "checked":"";
      return `<label class="option-btn ${savedVal.includes(opt)?'selected':''}">
        <input type="checkbox" id="m-${q.id}-${i}" ${checked} style="margin-right:8px;" onchange="syncAndRerender('${exId}')">
        ${opt}</label>`;
    }).join("");
  } else if(q.type==="fill"){
    const savedVal = st.answers[q.id] || [];
    body = q.answer.map((_,i)=>{
      const label = q.labels ? q.labels[i] : ("Answer "+(i+1));
      const v = savedVal[i] || "";
      return `<div class="fill-row"><label>${label}</label><input type="text" id="f-${q.id}-${i}" value="${escapeHtml(v)}" placeholder="Type here"></div>`;
    }).join("");
  } else if(q.type==="short"){
    const v = st.answers[q.id] || "";
    body = `<input type="text" id="s-${q.id}" value="${escapeHtml(v)}" placeholder="Type your answer">`;
  } else if(q.type==="text"){
    const v = st.answers[q.id] || "";
    body = `<textarea id="t-${q.id}" placeholder="Write as much as you like...">${escapeHtml(v)}</textarea>`;
  }

  const isLast = st.index === ex.questions.length - 1;
  app.innerHTML = `
    <div class="top" style="text-align:left; display:flex; justify-content:space-between; align-items:center;">
      <span class="progress-label">${ex.label} — Question ${st.index+1} of ${ex.questions.length}</span>
      <span class="progress-label">Code: <strong>${state.code}</strong></span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card"><h2>${q.prompt}</h2>${body}</div>
    <div class="btn-row">
      ${st.index>0 ? `<button class="btn btn-ghost" onclick="goTo('${exId}', ${st.index-1})">← Back</button>` : `<button class="btn btn-ghost" onclick="openChapter('${ch.id}')">← Exit</button>`}
      <button class="btn btn-primary" onclick="goNext('${exId}')">${isLast ? "🏁 Finish This Exercise" : "Next →"}</button>
    </div>
    <p class="foot-note">Progress saves automatically on this device.</p>
  `;
}
function syncAndRerender(exId){
  const { ex } = findExercise(exId);
  const st = getExState(exId);
  const q = ex.questions[st.index];
  st.answers[q.id] = collectCurrentAnswer(q);
  renderQuestion(exId);
}
function goTo(exId, i){
  const { ex } = findExercise(exId);
  const st = getExState(exId);
  const q = ex.questions[st.index];
  st.answers[q.id] = collectCurrentAnswer(q);
  st.index = i; saveSession(); renderQuestion(exId);
}
function goNext(exId){
  const { ex } = findExercise(exId);
  const st = getExState(exId);
  const q = ex.questions[st.index];
  st.answers[q.id] = collectCurrentAnswer(q);
  if(st.index < ex.questions.length-1){ st.index++; saveSession(); renderQuestion(exId); }
  else { st.submitted = true; saveSession(); renderExerciseResults(exId); }
}

function renderExerciseResults(exId){
  const { ex, ch } = findExercise(exId);
  const st = getExState(exId);
  let sc=0, mx=0;
  const rows = ex.questions.map(q=>{
    const r = checkAnswer(q, st.answers[q.id]);
    const userAns = formatAnswer(q, st.answers[q.id]);
    const correctAns = formatCorrect(q);
    let tag = `<span class="tag note">💭 Your idea</span>`;
    if(r){
      sc+=r.score; mx+=r.max;
      if(r.score===r.max) tag = `<span class="tag good">✅ Correct</span>`;
      else if(r.score===0) tag = `<span class="tag bad">❌ Try again</span>`;
      else tag = `<span class="tag note">➗ ${r.score}/${r.max}</span>`;
    }
    return `<div class="qa"><div class="prompt">${q.prompt}</div>${tag}
      <div class="explain"><strong>Your answer:</strong> ${userAns || "<em>(no answer given)</em>"}</div>
      ${r ? `<div class="explain"><strong>Correct answer:</strong> ${correctAns}</div>` : ""}
      <div class="explain">${q.explain || q.sample ? ("Tip: " + (q.explain || ("One good answer: " + q.sample))) : ""}</div>
    </div>`;
  }).join("");
  const pct = mx? Math.round(sc/mx*100) : 100;
  const msg = pct>=90 ? "🌟 Superstar work!" : pct>=70 ? "🎉 Great job!" : pct>=50 ? "👍 Good effort — a bit more practice will help." : "💪 Let's go over this one again together.";

  app.innerHTML = `
    <div class="top"><div class="mascot">${ch.emoji}</div><h1>${ex.label} — Results</h1></div>
    <div class="card"><div class="score-big">${sc} / ${mx}</div><div class="score-msg">${pct}% — ${msg}</div></div>
    <div class="card"><h2>📖 Answer Key</h2>${rows}</div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="retryExercise('${exId}')">🔄 Redo This Exercise</button>
      <button class="btn btn-ghost" onclick="openChapter('${ch.id}')">← Back to ${ch.title}</button>
    </div>
  `;
}
function retryExercise(exId){
  state.exercises[exId] = { index:0, answers:{}, submitted:false };
  saveSession(); renderQuestion(exId);
}

function formatAnswer(q, ans){
  if(ans===undefined || ans===null || ans==="") return "";
  if(q.type==="multi") return escapeHtml((ans||[]).join(", "));
  if(q.type==="fill") return escapeHtml((ans||[]).join(", "));
  return escapeHtml(ans);
}
function formatCorrect(q){
  if(q.type==="multi") return q.answer.join(", ");
  if(q.type==="fill") return q.answer.join(", ");
  if(q.type==="short") return q.answer[0];
  return q.answer;
}

function showOverallReport(){
  let grand={sc:0,mx:0};
  const chapterRows = BOOK.map(ch=>{
    let sc=0, mx=0, done=0;
    ch.exercises.forEach(ex=>{
      const st = state.exercises[ex.id];
      if(st && st.submitted){
        done++;
        ex.questions.forEach(q=>{ const r=checkAnswer(q, st.answers[q.id]); if(r){ sc+=r.score; mx+=r.max; } });
      }
    });
    grand.sc+=sc; grand.mx+=mx;
    const pct = mx? Math.round(sc/mx*100) : 0;
    return `<div class="cat-bar-row"><div class="label"><span>${ch.emoji} ${ch.title} (${done}/${ch.exercises.length} exercises)</span><span>${mx? sc+"/"+mx : "—"}</span></div>
      <div class="cat-track"><div class="cat-fill" style="width:${pct}%"></div></div></div>`;
  }).join("");
  const gp = grand.mx? Math.round(grand.sc/grand.mx*100) : 0;

  app.innerHTML = `
    <div class="top"><div class="mascot">🏆</div><h1>Your Overall Report</h1></div>
    <div class="card"><div class="score-big">${grand.mx? grand.sc+" / "+grand.mx : "No exercises done yet"}</div>
      ${grand.mx? `<div class="score-msg">${gp}% across everything you've completed so far</div>` : ""}</div>
    <div class="card"><h2>By Chapter</h2>${chapterRows}</div>
    <div class="card"><h2>🎨 Bonus: Try These With a Grown-Up</h2>
      <ul class="simple">
        <li><strong>Ch 3:</strong> Write a mini "subtraction storybook" with a 4-digit subtraction problem on each page.</li>
        <li><strong>Ch 3:</strong> Try the abacus activity: use bead colours to subtract 286 from 453.</li>
        <li><strong>Ch 3:</strong> Draw the Indian flag, then use subtraction to find how many years of Independence and Republic Day we're celebrating this year — and colour it in!</li>
        <li><strong>Ch 4:</strong> Play "Multiplication Musical Dice" — roll two dice, call out the product, and pass it on before the music stops.</li>
        <li><strong>Ch 5:</strong> Plan a pretend birthday party and divide snacks, drinks, and candies equally among your friends.</li>
        <li><strong>Ch 5:</strong> Make "Division Art" — shape playdough or draw pictures to show the answer to a division fact.</li>
        <li><strong>Ch 6:</strong> Do the paper-folding lab: fold circles into halves and quarters, then shade and label them.</li>
        <li><strong>Ch 6:</strong> Make a "Fraction Lotus" flower from coloured paper circles.</li>
        <li><strong>Ch 6:</strong> Draw the Earth, colour 1/4 of it brown for land and the rest blue for water.</li>
      </ul>
    </div>
    <div class="btn-row"><button class="btn btn-primary btn-full" onclick="renderHome()">← Back to Chapters</button></div>
  `;
}

/* =========================================================================
   PART 6: START THE APP
   ========================================================================= */
renderHome();
</script>
