    div.innerHTML =
      '<div class="chapter-num">' + label + '</div>' +
      '<div><div class="chapter-title">' + CHAPTER_TITLES[num] + '</div>' +
      '<div class="chapter-count">' + count + ' questions</div></div>';
    list.appendChild(div);
  });
}

function goHome() {
  document.getElementById('screen-home').classList.remove('hidden');
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-results').classList.add('hidden');
}

function startQuiz(chapterNumber) {
  activeQuestions = chapterNumber === null
    ? ALL_QUESTIONS.slice()
    : ALL_QUESTIONS.filter(q => q.chapterNumber === chapterNumber);
  currentIndex = 0;
  studentAnswers = {};
  document.getElementById('screen-home').classList.add('hidden');
  document.getElementById('screen-results').classList.add('hidden');
  document.getElementById('screen-quiz').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = activeQuestions[currentIndex];
  document.getElementById('progress-bar').style.width =
    (((currentIndex) / activeQuestions.length) * 100) + '%';
  document.getElementById('progress-label').textContent =
    'Question ' + (currentIndex + 1) + ' of ' + activeQuestions.length + '  -  ' + q.chapterTitle;
  document.getElementById('q-badge').textContent = q.questionType.replace(/_/g, ' ');
  document.getElementById('q-text').textContent = q.questionText;

  const area = document.getElementById('q-answer-area');
  area.innerHTML = '';
  const saved = studentAnswers[q.id];

  if (q.questionType === 'TRUE_FALSE') {
    ['True', 'False'].forEach(choice => {
      const btn = document.createElement('div');
      btn.className = 'option' + (saved === choice ? ' selected' : '');
      btn.textContent = choice;
      btn.onclick = () => { studentAnswers[q.id] = choice; renderQuestion(); };
      area.appendChild(btn);
    });
  } else if (q.questionType === 'MULTIPLE_CHOICE') {
    const isMulti = q.correctAnswer && q.correctAnswer.length > 1;
    const savedArr = Array.isArray(saved) ? saved : (saved ? [saved] : []);
    (q.options || []).forEach(opt => {
      const picked = savedArr.includes(opt);
      const btn = document.createElement('div');
      btn.className = 'option' + (picked ? ' selected' : '');
      btn.textContent = opt;
      btn.onclick = () => {
        if (isMulti) {
          let arr = Array.isArray(studentAnswers[q.id]) ? studentAnswers[q.id] : [];
          if (arr.includes(opt)) arr = arr.filter(x => x !== opt);
          else arr = arr.concat([opt]);
          studentAnswers[q.id] = arr;
        } else {
          studentAnswers[q.id] = opt;
        }
        renderQuestion();
      };
      area.appendChild(btn);
    });
    if (isMulti) {
      const note = document.createElement('div');
      note.className = 'ungraded-note';
      note.textContent = 'Tap all that apply.';
      area.appendChild(note);
    }
  } else if (q.questionType === 'FILL_IN_BLANK') {
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Type your answer here';
    input.value = saved || '';
    input.oninput = () => { studentAnswers[q.id] = input.value; };
    area.appendChild(input);
  } else if (q.questionType === 'LONG_ANSWER') {
    const ta = document.createElement('textarea');
    ta.rows = Math.max(2, q.answerSpaceLines || 4);
    ta.placeholder = 'Write your answer here';
    ta.value = saved || '';
    ta.oninput = () => { studentAnswers[q.id] = ta.value; };
    area.appendChild(ta);
    const note = document.createElement('div');
    note.className = 'ungraded-note';
    note.textContent = 'This is a writing question - it is not auto-scored.';
    area.appendChild(note);
  } else if (q.questionType === 'MATCHING') {
    (q.matchingPairs || []).forEach(pair => {
      const row = document.createElement('div');
      row.className = 'match-row';
      row.innerHTML = '<span>' + pair.left + '</span><span>&#8596;</span><span>' + pair.right + '</span>';
      area.appendChild(row);
    });
    const note = document.createElement('div');
    note.className = 'ungraded-note';
    note.textContent = 'Read the pairs together - they are already matched correctly here for learning.';
    area.appendChild(note);
    studentAnswers[q.id] = 'viewed';
  } else if (q.questionType === 'ORDERING') {
    (q.options || []).forEach((item, i) => {
      const row = document.createElement('div');
      row.className = 'order-row';
      row.innerHTML = '<span>' + item + '</span>';
      area.appendChild(row);
    });
    const note = document.createElement('div');
    note.className = 'ungraded-note';
    note.textContent = 'Try saying these steps in the correct order out loud before moving on.';
    area.appendChild(note);
    studentAnswers[q.id] = 'viewed';
  }

  document.getElementById('btn-back').disabled = currentIndex === 0;
  document.getElementById('btn-next').textContent =
    currentIndex === activeQuestions.length - 1 ? 'Finish' : 'Next';
}

function goBack() {
  if (currentIndex > 0) { currentIndex--; renderQuestion(); }
}

function goNext() {
  if (currentIndex < activeQuestions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    showResults();
  }
}

function isCorrect(q, given) {
  if (!q.correctAnswer || q.correctAnswer.length === 0) return null;
  if (q.questionType === 'TRUE_FALSE') {
    return given === q.correctAnswer[0];
  }
  if (q.questionType === 'FILL_IN_BLANK') {
    if (!given) return false;
    const g = normalize(given);
    return q.correctAnswer.some(ans =>
      ans.split(/[\/,()]/).some(part => {
        const p = normalize(part);
        return p.length > 0 && (g.includes(p) || p.includes(g));
      })
    );
  }
  if (q.questionType === 'MULTIPLE_CHOICE') {
    const givenArr = Array.isArray(given) ? given.slice().sort() : (given ? [given] : []);
    const correctArr = q.correctAnswer.slice().sort();
    return JSON.stringify(givenArr) === JSON.stringify(correctArr);
  }
  return null;
}

function showResults() {
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-results').classList.remove('hidden');

  let correctCount = 0, gradableCount = 0;
  const reviewList = document.getElementById('review-list');
  reviewList.innerHTML = '';

  activeQuestions.forEach(q => {
    const given = studentAnswers[q.id];
    const result = isCorrect(q, given);
    if (result !== null) {
      gradableCount++;
      if (result) correctCount++;
    }
    const item = document.createElement('div');
    item.className = 'card review-item ' + (result === true ? 'correct' : result === false ? 'wrong' : '');
    let tagHtml = '';
    if (result === true) tagHtml = '<span class="review-tag correct">&#10003; Correct</span>';
    else if (result === false) tagHtml = '<span class="review-tag wrong">&#10007; Try again</span>';
    else tagHtml = '<span class="review-tag" style="color:#6b6b76;">Not auto-scored</span>';

    let givenText = Array.isArray(given) ? given.join(', ') : (given || '(no answer given)');
    let correctText = q.correctAnswer ? q.correctAnswer.join(' / ') : 'Not stated in the workbook';

    item.innerHTML =
      '<div style="font-size:13px;color:#6b6b76;">' + q.chapterTitle + '</div>' +
      '<div style="font-weight:600;margin:6px 0;">' + q.questionText + '</div>' +
      tagHtml +
      (q.questionType === 'MATCHING' || q.questionType === 'ORDERING' || q.questionType === 'LONG_ANSWER'
        ? ''
        : '<div class="review-answer"><span class="label">Your answer:</span> ' + givenText + '<br>' +
          '<span class="label">Correct answer:</span> ' + correctText + '</div>');
    reviewList.appendChild(item);
  });

  document.getElementById('score-big').textContent = correctCount + ' / ' + gradableCount;
  document.getElementById('score-sub').textContent =
    'correct on auto-scored questions (Multiple Choice, True/False, Fill in the Blank)';
}

buildHome();
</script>
