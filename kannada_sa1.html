<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kannada SA1 Practice Quiz — Class 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Sans+Kannada:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF4E6; --card:#FFFFFF; --ink:#3A2410; --ink-soft:#6B5A4A;
    --brand:#E8743B; --brand-dark:#C85A20; --teal:#1E8A99;
    --good:#2FA86A; --good-bg:#E5F7EC; --bad:#D64550; --bad-bg:#FCEAEA;
    --sun:#FFC145; --line:#F0DFC9;
    --font-head:'Baloo 2','Comic Sans MS', system-ui, sans-serif;
    --font-body:'Nunito', system-ui, -apple-system, sans-serif;
    --font-kn:'Noto Sans Kannada', 'Nunito', sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241810; --card:#302016; --ink:#F5E8D8; --ink-soft:#C8B49E;
      --line:#4A3524; --good-bg:#173626; --bad-bg:#3A1E21;
    }
  }
  :root[data-theme="dark"]{
    --bg:#241810; --card:#302016; --ink:#F5E8D8; --ink-soft:#C8B49E;
    --line:#4A3524; --good-bg:#173626; --bad-bg:#3A1E21;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.55; }
  .wrap{ max-width:680px; margin:0 auto; padding:20px 16px 70px; }
  h1,h2,h3{ font-family:var(--font-head); margin:0 0 8px; line-height:1.2; }
  h1{ font-size:1.6rem; color:var(--brand-dark); }
  h2{ font-size:1.25rem; }
  p{ margin:0 0 12px; color:var(--ink-soft); }
  .kn{ font-family:var(--font-kn); }
  .top{ text-align:center; padding:18px 0 6px; }
  .top .mascot{ font-size:2.4rem; }
  .card{ background:var(--card); border-radius:18px; padding:20px; box-shadow:0 6px 18px rgba(58,36,16,0.08); border:1px solid var(--line); margin-bottom:16px; }
  .btn{ font-family:var(--font-head); font-size:1rem; font-weight:700; border:none; border-radius:14px; padding:13px 20px; cursor:pointer; display:inline-block; text-align:center; transition:transform .08s ease; }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--brand); color:#fff; }
  .btn-primary:hover{ background:var(--brand-dark); }
  .btn-ghost{ background:transparent; color:var(--teal); border:2px solid var(--teal); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .btn-full{ width:100%; }
  .badge{ display:inline-block; background:var(--sun); color:#5A3E00; font-family:var(--font-head); font-weight:700; font-size:0.78rem; padding:4px 12px; border-radius:999px; margin-bottom:10px; }
  .progress-track{ height:10px; background:var(--line); border-radius:999px; overflow:hidden; margin:10px 0 4px; }
  .progress-fill{ height:100%; background:var(--brand); border-radius:999px; transition:width .25s ease; }
  .progress-label{ font-size:0.85rem; color:var(--ink-soft); }
  .option-btn{ display:block; width:100%; text-align:left; background:var(--bg); border:2px solid var(--line); border-radius:14px; padding:13px 16px; margin-bottom:10px; font-family:var(--font-body); font-size:1rem; color:var(--ink); cursor:pointer; }
  .option-btn.selected{ border-color:var(--brand); background:#FFEADF; }
  :root[data-theme="dark"] .option-btn.selected{ background:#4A2E1A; }
  @media (prefers-color-scheme:dark){ .option-btn.selected{ background:#4A2E1A; } }
  .fill-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .fill-row label{ min-width:90px; font-weight:700; color:var(--ink-soft); font-size:0.9rem; }
  input[type=text]{ font-family:var(--font-body); font-size:1rem; padding:11px 12px; border:2px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); width:100%; }
  details{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:12px; }
  summary{ font-family:var(--font-head); font-weight:700; cursor:pointer; font-size:1.05rem; }
  .qa{ border-top:1px solid var(--line); padding:12px 0; }
  .qa:first-of-type{ border-top:none; }
  .qa .prompt{ font-weight:700; color:var(--ink); margin-bottom:4px; }
  .tag{ display:inline-block; font-size:0.78rem; font-weight:800; border-radius:8px; padding:2px 9px; margin-right:6px; }
  .tag.good{ background:var(--good-bg); color:var(--good); }
  .tag.bad{ background:var(--bad-bg); color:var(--bad); }
  .tag.note{ background:var(--line); color:var(--ink-soft); }
  .explain{ font-size:0.92rem; color:var(--ink-soft); margin-top:4px; }
  .score-big{ font-family:var(--font-head); font-size:2.4rem; color:var(--brand); text-align:center; margin:6px 0; }
  .score-msg{ text-align:center; font-weight:700; color:var(--ink); }
  .cat-bar-row{ margin-bottom:12px; }
  .cat-bar-row .label{ display:flex; justify-content:space-between; font-size:0.9rem; font-weight:700; margin-bottom:4px; }
  .cat-track{ height:12px; background:var(--line); border-radius:999px; overflow:hidden; }
  .cat-fill{ height:100%; background:var(--teal); border-radius:999px; }
  .session-box{ background:var(--good-bg); border:2px dashed var(--good); border-radius:14px; padding:14px; margin-bottom:16px; }
  .code-chip{ font-family:var(--font-head); font-size:1.3rem; letter-spacing:3px; background:var(--card); border:2px solid var(--brand); color:var(--brand-dark); padding:6px 14px; border-radius:10px; display:inline-block; margin:6px 0; }
  .hint-box{ background:#FFF9E6; border-left:4px solid var(--sun); border-radius:8px; padding:10px 12px; margin-top:10px; font-size:0.9rem; color:#7F6C00; }
  :root[data-theme="dark"] .hint-box{ background:#3A3010; color:#F0D878; }
  @media (prefers-color-scheme:dark){ .hint-box{ background:#3A3010; color:#F0D878; } }
  .hint-btn{ background:transparent; border:none; color:var(--teal); font-weight:700; cursor:pointer; font-family:var(--font-head); font-size:0.95rem; padding:4px 0; }
  .instr{ background:var(--card); border:1px dashed var(--teal); border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:0.92rem; }
  .instr .instr-kn{ color:var(--brand-dark); font-weight:700; font-family:var(--font-kn); }
  .instr .instr-en{ color:var(--ink-soft); font-style:italic; }
  ul.simple{ padding-left:20px; color:var(--ink-soft); }
  ul.simple li{ margin-bottom:6px; }
  .foot-note{ text-align:center; font-size:0.8rem; color:var(--ink-soft); margin-top:24px; }
  .back-link{ display:block; text-align:center; color:var(--teal); text-decoration:none; font-size:0.9rem; margin-bottom:8px; }
  .back-link:hover{ text-decoration:underline; }
</style>
</head>

<div class="wrap" id="app"></div>

/* =========================================================================
   REJOIN CODE + AUTOSAVE
   Progress is saved in the browser's localStorage. If the quiz is
   interrupted (page closed, internet drops), the student can continue
   using their 6-letter code — on the same device + browser.
   ========================================================================= */
const STORAGE_KEY = "kannadaSA1QuizSession";
function makeCode(){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let code = ""; for(let i=0;i<6;i++){ code += chars[Math.floor(Math.random()*chars.length)]; }
  return code;
}
function saveSession(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function loadSession(){ try{ const r = localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }
function clearSession(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }

let state = { code:null, index:0, answers:{}, hintsShown:{}, submitted:false };
const app = document.getElementById("app");

function norm(s){ return (s||"").toString().trim().toLowerCase(); }
function escapeHtml(s){
  if(s===undefined || s===null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
/* Accept Kannada digits OR English digits for number fill-ins */
const KN_TO_EN = {"೦":"0","೧":"1","೨":"2","೩":"3","೪":"4","೫":"5","೬":"6","೭":"7","೮":"8","೯":"9"};
function normDigits(s){ s=norm(s); let out=""; for(const ch of s){ out+=KN_TO_EN[ch]||ch; } return out; }

function checkAnswer(q, ans){
  switch(q.type){
    case "mcq": return { score:(ans===q.answer)?1:0, max:1 };
    case "tf":  return { score:((ans===true||ans==="true")===q.answer)?1:0, max:1 };
    case "fill": {
      const u = (ans||[]).map(normDigits);
      const c = q.answer.map(normDigits);
      let sc=0;
      if(q.ordered){ c.forEach((x,i)=>{ if(u[i]===x) sc++; }); }
      else { const rem=[...c]; u.forEach(x=>{ const i=rem.indexOf(x); if(i>-1){ sc++; rem.splice(i,1); } }); }
      return { score:sc, max:c.length };
    }
  }
  return null;
}

function collectCurrentAnswer(q){
  if(q.type==="mcq" || q.type==="tf"){
    const el = document.querySelector('input[name="r-'+q.id+'"]:checked');
    return el ? el.value : null;
  }
  if(q.type==="fill"){
    return q.answer.map((_,i)=>{ const el=document.getElementById("f-"+q.id+"-"+i); return el?el.value:""; });
  }
  return null;
}

function tryRejoin(){
  const typed = document.getElementById("rejoin-input").value.trim().toUpperCase();
  const saved = loadSession();

    if(saved.submitted){ reopenResults(); } else { resumeSession(); }
  } else {
    msg.textContent = "We couldn't find that code on this device. Codes only work on the same device/browser you started on.";
    msg.style.color = "var(--bad)";
  }
}

function startFresh(){
  state = { code:makeCode(), index:0, answers:{}, hintsShown:{}, submitted:false };
  saveSession(); renderQuiz();
}
function resumeSession(){ const s=loadSession(); if(s){ state=s; if(!state.hintsShown) state.hintsShown={}; } renderQuiz(); }
function reopenResults(){ const s=loadSession(); if(s){ state=s; } renderResults(); }

function renderQuiz(){
  const q = QUESTIONS[state.index];
  const pct = Math.round((state.index)/QUESTIONS.length*100);
  let body = "";
  if(q.type==="mcq" || q.type==="tf"){
    const opts = q.type==="tf" ? ["True / ಸರಿ","False / ತಪ್ಪು"] : q.options;
    const sv = state.answers[q.id];
    body = opts.map(opt=>{
      const val = q.type==="tf" ? (opt.startsWith("True")?"true":"false") : opt;
      const checked = sv===val ? "checked" : "";
      return `<label class="option-btn ${sv===val?'selected':''}">
                <input type="radio" name="r-${q.id}" value="${escapeHtml(val)}" ${checked} style="margin-right:8px;" onchange="onAnswerChange('${q.id}')">
                ${escapeHtml(opt)}
              </label>`;
    }).join("");
  } else if(q.type==="fill"){
    const sv = state.answers[q.id] || [];
    body = q.answer.map((_,i)=>{
      const label = q.labels ? q.labels[i] : ("Answer "+(i+1));
      const v = sv[i] || "";
      return `<div class="fill-row"><label>${escapeHtml(label)}</label><input type="text" id="f-${q.id}-${i}" value="${escapeHtml(v)}" placeholder="Type here" oninput="onFillChange('${q.id}')"></div>`;
    }).join("");
  }
  const isLast = state.index === QUESTIONS.length - 1;
  const hs = state.hintsShown && state.hintsShown[q.id];
  app.innerHTML = `
    <div class="top" style="text-align:left; display:flex; justify-content:space-between; align-items:center;">
      <span class="progress-label">Question ${state.index+1} of ${QUESTIONS.length}</span>
      <span class="progress-label">Code: <strong>${state.code}</strong></span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <span class="badge">${escapeHtml(q.cat)}</span>
      <div class="instr">
        <div class="instr-kn">ಕನ್ನಡ: ${escapeHtml(q.instructionKn)}</div>
        <div class="instr-en">English: ${escapeHtml(q.instructionEn)}</div>
      </div>
      <h2>${escapeHtml(q.prompt)}</h2>
      ${body}
      <button class="hint-btn" onclick="toggleHint('${q.id}')">💡 ${hs?'Hide':'Show'} Hint</button>
      <div class="hint-box" style="display:${hs?'block':'none'};">💡 ${escapeHtml(q.hint)}</div>
    </div>
    <div class="btn-row">
      ${state.index>0 ? `<button class="btn btn-ghost" onclick="goTo(${state.index-1})">← Back</button>` : ""}
      <button class="btn btn-primary" onclick="goNext()">${isLast ? "🏁 See My Results" : "Next →"}</button>
    </div>
    <p class="foot-note">Your progress is saved automatically on this device. / ನಿಮ್ಮ ಉತ್ತರಗಳು ಸ್ವಯಂಚಾಲಿತವಾಗಿ ಉಳಿಸಲ್ಪಡುತ್ತವೆ.</p>
  `;
}

function onAnswerChange(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  state.answers[qid] = collectCurrentAnswer(q);
  saveSession(); renderQuiz();
}
function onFillChange(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  state.answers[qid] = collectCurrentAnswer(q);
  saveSession();
}
function toggleHint(qid){
  if(!state.hintsShown) state.hintsShown = {};
  state.hintsShown[qid] = !state.hintsShown[qid];
  const q = QUESTIONS.find(x=>x.id===qid);
  const cur = collectCurrentAnswer(q);
  if(cur !== null) state.answers[qid] = cur;
  saveSession(); renderQuiz();
}
function goTo(i){
  const q = QUESTIONS[state.index];
  state.answers[q.id] = collectCurrentAnswer(q);
  state.index = i; saveSession(); renderQuiz();
}
function goNext(){
  const q = QUESTIONS[state.index];
  state.answers[q.id] = collectCurrentAnswer(q);
  if(state.index < QUESTIONS.length-1){ state.index++; saveSession(); renderQuiz(); }
  else { submitQuiz(); }
}
function submitQuiz(){ state.submitted=true; saveSession(); renderResults(); }

function renderResults(){
  const catTotals = {};
  CATEGORY_ORDER.forEach(c=>catTotals[c]={score:0,max:0});
  let total=0, max=0;
  QUESTIONS.forEach(q=>{
    const r = checkAnswer(q, state.answers[q.id]);
    if(r){ catTotals[q.cat].score+=r.score; catTotals[q.cat].max+=r.max; total+=r.score; max+=r.max; }
  });
  const pct = max ? Math.round((total/max)*100) : 0;
  const msg = pct>=90 ? "🌟 ಅದ್ಭುತ! Superstar! You really know your Kannada!" :
              pct>=70 ? "🎉 ಬಹಳ ಒಳ್ಳೆಯದು! Great job!" :
              pct>=50 ? "👍 ಒಳ್ಳೆಯ ಪ್ರಯತ್ನ! Good effort! A little more practice." :
                        "💪 ಮತ್ತೊಮ್ಮೆ ಪ್ರಯತ್ನಿಸಿ! Keep practising — you'll get there.";
  const catBars = CATEGORY_ORDER.map(c=>{
    const t = catTotals[c]; if(t.max===0) return "";
    const p = Math.round((t.score/t.max)*100);
    const note = p>=80 ? "Great work here!" : p>=50 ? "Good — a little more practice will help." : "Let's review this together.";
    return `<div class="cat-bar-row">
              <div class="label"><span>${escapeHtml(c)}</span><span>${t.score}/${t.max}</span></div>
              <div class="cat-track"><div class="cat-fill" style="width:${p}%"></div></div>
              <div class="explain">${note}</div>
            </div>`;
  }).join("");
  const answerKey = CATEGORY_ORDER.map(cat=>{
    const qs = QUESTIONS.filter(q=>q.cat===cat); if(qs.length===0) return "";
    const items = qs.map(q=>{
      const r = checkAnswer(q, state.answers[q.id]);
      const ua = formatAnswer(q, state.answers[q.id]);
      const ca = formatCorrect(q);
      let tag = `<span class="tag note">💭 Not answered</span>`;
      if(r){
        if(r.score===r.max) tag = `<span class="tag good">✅ Correct</span>`;
        else if(r.score===0) tag = `<span class="tag bad">❌ Try again</span>`;
        else tag = `<span class="tag note">➗ ${r.score}/${r.max} correct</span>`;
      }
      return `<div class="qa">
                <div class="prompt">${escapeHtml(q.prompt)}</div>
                ${tag}
                <div class="explain"><strong>Your answer:</strong> ${ua || "<em>(no answer)</em>"}</div>
                <div class="explain"><strong>Correct answer:</strong> ${escapeHtml(ca)}</div>
                <div class="explain">${escapeHtml(q.explain||"")}</div>
              </div>`;
    }).join("");
    return `<details><summary>${escapeHtml(cat)}</summary>${items}</details>`;
  }).join("");
  app.innerHTML = `
    <a href="index.html" class="back-link">⬅ Back to all quizzes</a>
    <div class="top"><div class="mascot">🏆</div><h1>Your Results / ನಿಮ್ಮ ಫಲಿತಾಂಶ</h1></div>
    <div class="card">
      <div class="score-big">${total} / ${max}</div>
      <div class="score-msg">${pct}% — ${msg}</div>
    </div>
    <div class="card">
      <h2>Score by Topic / ವಿಷಯವಾರು ಅಂಕಗಳು</h2>
      ${catBars}
    </div>
    <div class="card">
      <h2>📖 Full Answer Key &amp; Explanations</h2>
      <p>Tap any topic below to see every question, your answer, and the correct answer.</p>
      ${answerKey}
    </div>
    <div class="card">
      <h2>🎨 Try These At Home! (just for fun)</h2>
      <ul class="simple">
        <li>Write Kannada numbers ೧ to ೨೦ on paper with coloured pens.</li>
        <li>Say the ಚಿಟ್ಟೆ poem out loud — ask amma or ajji to listen!</li>
        <li>Make flashcards for the fruit &amp; vegetable Kannada names.</li>
        <li>Write 5 words that have an ಒತ್ತಕ್ಷರ (baby letter) in your notebook.</li>
      </ul>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary btn-full" onclick="startFresh()">🔄 Take the Quiz Again / ಮತ್ತೊಮ್ಮೆ</button>
    </div>
  `;
}
function formatAnswer(q, a){
  if(a===undefined||a===null||a==="") return "";
  if(q.type==="tf") return a==="true"||a===true ? "True" : "False";
  if(q.type==="fill") return escapeHtml((a||[]).join(", "));
  return escapeHtml(a);
}
function formatCorrect(q){
  if(q.type==="tf") return q.answer ? "True" : "False";
  if(q.type==="fill") return q.answer.join(", ");
  return q.answer;
}
