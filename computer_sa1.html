<html lang="en">
<head>

<title>Sports Week &amp; Class Chronicle Quiz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>

     COLOURS AND FONTS

  ======================================================= */

    --teal:#1E8A99;
    --good:#2FA86A;
    --good-bg:#E5F7EC;
    --bad:#D64550;
    --bad-bg:#FCEAEA;
    --sun:#FFC145;

      --bg:#0F1B24; --card:#182833; --ink:#EAF3F8; --ink-soft:#A9C0CE;
      --line:#25404D; --good-bg:#173626; --bad-bg:#3A1E21;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1B24; --card:#182833; --ink:#EAF3F8; --ink-soft:#A9C0CE;
    --line:#25404D; --good-bg:#173626; --bad-bg:#3A1E21;

    font-family:var(--font-body); line-height:1.55;

  .btn-primary:hover{ background:var(--brand-dark); }
  .btn-ghost{ background:transparent; color:var(--teal); border:2px solid var(--teal); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .btn-full{ width:100%; }

  .badge{
    display:inline-block; background:var(--sun); color:#5A3E00;

    padding:4px 12px; border-radius:999px; margin-bottom:10px;

  .progress-track{ height:10px; background:var(--line); border-radius:999px; overflow:hidden; margin:10px 0 4px; }
  .progress-fill{ height:100%; background:var(--brand); border-radius:999px; transition:width .25s ease; }

/* =========================================================================
   PART 2: SAVING PROGRESS (the "Rejoin Code" feature)
   We save the student's progress in the browser's own memory (localStorage)
   so if the page is closed or the internet drops, they can come back.
   A short "code" is shown to the student, like a locker number, so this
   feels like a real check-in / rejoin system.
   NOTE: this only works on the SAME device and browser the quiz was
   started on — that's just how browser storage works.
   ========================================================================= */
const STORAGE_KEY = "sportsWeekQuizSession";

function makeCode(){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; // no confusing 0/O/1/I/L
  let code = "";
  for(let i=0;i<6;i++){ code += chars[Math.floor(Math.random()*chars.length)]; }
  return code;
}

function saveSession(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* if storage isn't available, the quiz still works, it just won't remember */ }
}

function loadSession(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function clearSession(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
}

/* =========================================================================
   PART 3: THE APP'S "MEMORY" WHILE IT RUNS
   ========================================================================= */
let state = { code:null, index:0, answers:{}, submitted:false };
const app = document.getElementById("app");

/* =========================================================================
   PART 4: CHECKING ANSWERS
   Every question type has its own way of being checked. This function
   looks at the question type and returns how many points were earned
   out of how many were possible.
   ========================================================================= */
function norm(s){ return (s||"").toString().trim().toLowerCase(); }

// Turns anything the student typed into safe text, so it always displays
// correctly even if they type symbols like < or & or ".
function escapeHtml(s){
  if(s===undefined || s===null) return "";
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function checkAnswer(q, ans){
  switch(q.type){
    case "mcq":
      return { score:(ans===q.answer)?1:0, max:1 };
    case "tf":
      return { score:((ans===true||ans==="true")===q.answer)?1:0, max:1 };
    case "short": {
      const ok = q.answer.some(a=>norm(a)===norm(ans));
      return { score: ok?1:0, max:1 };
    }
    case "multi": {
      const selected = ans||[];
      let score=0;
      q.options.forEach(opt=>{
        const should = q.answer.includes(opt);
        const is = selected.includes(opt);
        if(should===is) score++;
      });
      return { score, max:q.options.length };
    }
    case "fill": {
      const userVals = (ans||[]).map(norm);
      const correctVals = q.answer.map(norm);
      let score=0;
      if(q.ordered){
        correctVals.forEach((c,i)=>{ if(userVals[i]===c) score++; });
      }else{
        const remaining=[...correctVals];
        userVals.forEach(u=>{
          const idx=remaining.indexOf(u);
          if(idx>-1){ score++; remaining.splice(idx,1); }
        });
      }
      return { score, max:correctVals.length };
    }
    case "classify": {
      const userMap = ans||{};
      let score=0;
      q.items.forEach(item=>{ if(userMap[item]===q.answer[item]) score++; });
      return { score, max:q.items.length };
    }
    default:
      return null; // "text" questions are reflections, not scored
  }
}

/* =========================================================================
   PART 5: READING WHAT THE STUDENT TYPED / CLICKED
   ========================================================================= */
function collectCurrentAnswer(q){
  switch(q.type){
    case "mcq": case "tf": {
      const el = document.querySelector('input[name="r-'+q.id+'"]:checked');
      return el ? el.value : null;
    }
    case "short": {
      const el = document.getElementById("s-"+q.id);
      return el ? el.value : "";
    }
    case "text": {
      const el = document.getElementById("t-"+q.id);
      return el ? el.value : "";
    }
    case "multi": {
      return q.options.filter(opt=>{
        const el = document.getElementById("m-"+q.id+"-"+q.options.indexOf(opt));
        return el && el.checked;
      });
    }
    case "fill": {
      return q.answer.map((_,i)=>{
        const el = document.getElementById("f-"+q.id+"-"+i);
        return el ? el.value : "";
      });
    }
    case "classify": {
      const map = {};
      q.items.forEach(item=>{
        const el = document.getElementById("c-"+q.id+"-"+item);
        map[item] = el ? el.value : "";
      });
      return map;
    }
  }
  return null;
}

        </div>`;
    } else {
      banner = `
        <div class="session-box">
          <strong>We found a saved quiz in progress!</strong><br>
          Your code is <span class="code-chip">${saved.code}</span> — Question ${saved.index+1} of ${QUESTIONS.length}.
          <div class="btn-row">
            <button class="btn btn-primary" onclick="resumeSession()">▶ Resume Quiz</button>
            <button class="btn btn-ghost" onclick="startFresh()">🔄 Start Fresh</button>
          </div>
        </div>`;
    }
  }

  app.innerHTML = `
    <div class="top">
      <div class="mascot">🦊🏅</div>
      <h1>Sports Week &amp; Class Chronicle Quiz</h1>
      <p>A fun review of everything you learned about word processors, formatting, lists and tables!</p>
    </div>
    ${banner}
    <div class="card">
      <h2>Before you start</h2>
      <p>There are ${QUESTIONS.length} questions. Some have a single right answer, and a few just ask what YOU think — there's no wrong answer for those!</p>
      <p>When you click "Start", you'll get a <strong>Session Code</strong>. Write it down! If the quiz ever gets interrupted, come back to this page and use the code to pick up right where you left off (as long as you're on the same device).</p>
      <button class="btn btn-primary btn-full" onclick="startFresh()">🚀 Start the Quiz</button>
    </div>
    <div class="card">
      <h3>Have a rejoin code?</h3>
      <div style="display:flex; gap:8px;">
        <input type="text" id="rejoin-input" placeholder="e.g. AB3X9K" maxlength="6" style="text-transform:uppercase;">
        <button class="btn btn-ghost" onclick="tryRejoin()">Go</button>
      </div>
      <p id="rejoin-msg" style="margin-top:8px;"></p>
    </div>
  `;
}

function tryRejoin(){
  const typed = document.getElementById("rejoin-input").value.trim().toUpperCase();
  const saved = loadSession();
  const msg = document.getElementById("rejoin-msg");
  if(saved && saved.code === typed){
    if(saved.submitted){ reopenResults(); } else { resumeSession(); }
  } else {
    msg.textContent = "We couldn't find that code on this device. Codes only work on the same device/browser you started on.";
    msg.style.color = "var(--bad)";
  }
}

function startFresh(){
  state = { code:makeCode(), index:0, answers:{}, submitted:false };
  saveSession();
  renderQuiz();
}

function resumeSession(){
  const saved = loadSession();
  if(saved){ state = saved; }
  renderQuiz();
}

function reopenResults(){
  const saved = loadSession();
  if(saved){ state = saved; }
  renderResults();
}

function renderQuiz(){
  const q = QUESTIONS[state.index];
  const pct = Math.round((state.index)/QUESTIONS.length*100);

  let body = "";
  if(q.type==="mcq" || q.type==="tf"){
    const opts = q.type==="tf" ? ["True","False"] : q.options;
    const savedVal = state.answers[q.id];
    body = opts.map(opt=>{
      const val = q.type==="tf" ? (opt==="True"?"true":"false") : opt;
      const checked = savedVal===val ? "checked" : "";
      return `<label class="option-btn ${savedVal===val?'selected':''}">
                <input type="radio" name="r-${q.id}" value="${val}" ${checked} style="margin-right:8px;" onchange="highlightOptions('${q.id}')">
                ${opt}
              </label>`;
    }).join("");
  } else if(q.type==="multi"){
    const savedVal = state.answers[q.id] || [];
    body = q.options.map((opt,i)=>{
      const checked = savedVal.includes(opt) ? "checked" : "";
      return `<label class="option-btn ${savedVal.includes(opt)?'selected':''}">
                <input type="checkbox" id="m-${q.id}-${i}" ${checked} style="margin-right:8px;" onchange="highlightOptions('${q.id}')">
                ${opt}
              </label>`;
    }).join("");
  } else if(q.type==="fill"){
    const savedVal = state.answers[q.id] || [];
    body = q.answer.map((_,i)=>{
      const label = q.labels ? q.labels[i] : ("Answer "+(i+1));
      const v = savedVal[i] || "";
      return `<div class="fill-row"><label>${label}</label><input type="text" id="f-${q.id}-${i}" value="${escapeHtml(v)}" placeholder="Type here"></div>`;
    }).join("");
  } else if(q.type==="classify"){
    const savedVal = state.answers[q.id] || {};
    body = q.items.map(item=>{
      const optionsHtml = q.categories.map(c=>`<option value="${c}" ${savedVal[item]===c?'selected':''}>${c}</option>`).join("");
      return `<div class="classify-row"><span>${item}</span>
                <select id="c-${q.id}-${item}"><option value="">Choose...</option>${optionsHtml}</select></div>`;
    }).join("");
  } else if(q.type==="short"){
    const v = state.answers[q.id] || "";
    body = `<input type="text" id="s-${q.id}" value="${escapeHtml(v)}" placeholder="Type your answer">`;
  } else if(q.type==="text"){
    const v = state.answers[q.id] || "";
    body = `<textarea id="t-${q.id}" placeholder="Write as much as you like...">${escapeHtml(v)}</textarea>`;
  }

  const isLast = state.index === QUESTIONS.length - 1;

  app.innerHTML = `
    <div class="top" style="text-align:left; display:flex; justify-content:space-between; align-items:center;">
      <span class="progress-label">Question ${state.index+1} of ${QUESTIONS.length}</span>
      <span class="progress-label">Code: <strong>${state.code}</strong></span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <span class="badge">${q.cat}</span>
      <h2>${q.prompt}</h2>
      ${body}
    </div>
    <div class="btn-row">
      ${state.index>0 ? `<button class="btn btn-ghost" onclick="goTo(${state.index-1})">← Back</button>` : ""}
      <button class="btn btn-primary" onclick="goNext()">${isLast ? "🏁 See My Results" : "Next →"}</button>
    </div>
    <p class="foot-note">Your progress is saved automatically on this device.</p>
  `;
}

function highlightOptions(qid){
  // just re-render so the "selected" highlight follows the click
  const q = QUESTIONS.find(x=>x.id===qid);
  state.answers[qid] = collectCurrentAnswer(q);
  renderQuiz();
}

function goTo(i){
  const q = QUESTIONS[state.index];
  state.answers[q.id] = collectCurrentAnswer(q);
  state.index = i;
  saveSession();
  renderQuiz();
}

function goNext(){
  const q = QUESTIONS[state.index];
  state.answers[q.id] = collectCurrentAnswer(q);
  if(state.index < QUESTIONS.length-1){
    state.index++;
    saveSession();
    renderQuiz();
  } else {
    submitQuiz();
  }
}

function submitQuiz(){
  state.submitted = true;
  saveSession();
  renderResults();
}

function renderResults(){
  // Work out scores per category and overall
  const catTotals = {};
  CATEGORY_ORDER.forEach(c=>catTotals[c] = {score:0, max:0});
  let totalScore=0, totalMax=0;

  QUESTIONS.forEach(q=>{
    const result = checkAnswer(q, state.answers[q.id]);
    if(result){
      catTotals[q.cat].score += result.score;
      catTotals[q.cat].max += result.max;
      totalScore += result.score;
      totalMax += result.max;
    }
  });

  const overallPct = totalMax ? Math.round((totalScore/totalMax)*100) : 0;
  const overallMsg =
    overallPct>=90 ? "🌟 Superstar! You really know your word processor skills!" :
    overallPct>=70 ? "🎉 Great job! You understand most of this really well." :
    overallPct>=50 ? "👍 Good effort! A little more practice and you'll be an expert." :
                      "💪 Nice try! Let's go over these topics together — you'll get there.";

  const catBars = CATEGORY_ORDER.map(c=>{
    const t = catTotals[c];
    if(t.max===0) return ""; // categories with only reflection questions
    const pct = Math.round((t.score/t.max)*100);
    const note = pct>=80 ? "Great work here!" : pct>=50 ? "Good, a little more practice will help." : "Let's review this together.";
    return `<div class="cat-bar-row">
              <div class="label"><span>${c}</span><span>${t.score}/${t.max}</span></div>
              <div class="cat-track"><div class="cat-fill" style="width:${pct}%"></div></div>
              <div class="explain">${note}</div>
            </div>`;
  }).join("");

  const answerKey = CATEGORY_ORDER.map(cat=>{
    const qs = QUESTIONS.filter(q=>q.cat===cat);
    const items = qs.map(q=>{
      const result = checkAnswer(q, state.answers[q.id]);
      const userAns = formatAnswer(q, state.answers[q.id]);
      const correctAns = formatCorrect(q);
      let tag = `<span class="tag note">💭 Your idea</span>`;
      if(result){
        if(result.score===result.max) tag = `<span class="tag good">✅ Correct</span>`;
        else if(result.score===0) tag = `<span class="tag bad">❌ Try again</span>`;
        else tag = `<span class="tag note">➗ ${result.score}/${result.max} correct</span>`;
      }
      return `<div class="qa">
                <div class="prompt">${q.prompt}</div>
                ${tag}
                <div class="explain"><strong>Your answer:</strong> ${userAns || "<em>(no answer given)</em>"}</div>
                ${result ? `<div class="explain"><strong>Correct answer:</strong> ${correctAns}</div>` : `<div class="explain"><strong>One good answer:</strong> ${q.sample}</div>`}
                <div class="explain">${q.explain || ""}</div>
              </div>`;
    }).join("");
    return `<details><summary>${cat}</summary>${items}</details>`;
  }).join("");

  app.innerHTML = `
    <div class="top">
      <div class="mascot">🏆</div>
      <h1>Your Results</h1>
    </div>
    <div class="card">
      <div class="score-big">${totalScore} / ${totalMax}</div>
      <div class="score-msg">${overallPct}% — ${overallMsg}</div>
    </div>
    <div class="card">
      <h2>Score by Topic</h2>
      ${catBars}
    </div>
    <div class="card">
      <h2>📖 Full Answer Key &amp; Explanations</h2>
      <p>Tap any topic below to see every question, your answer, and why the correct answer is correct.</p>
      ${answerKey}
    </div>
    <div class="card">
      <h2>🎨 Try These With a Grown-Up! (just for fun — not scored)</h2>
      <ul class="simple">
        <li>Colour a picture of children pulling a rope to make a fun banner for your newsletter.</li>
        <li>Open a word processor, draw a shape, fill it with your favourite colour, make it 3D, and add a picture.</li>
        <li>On paper, design and decorate a real poster for your Annual Sports Day.</li>
        <li>Make a real class directory or timetable using a word processor — try adding small pictures instead of some words!</li>
      </ul>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary btn-full" onclick="startFresh()">🔄 Take the Quiz Again</button>
    </div>
  `;
}

function formatAnswer(q, ans){
  if(ans===undefined || ans===null || ans==="") return "";
  if(q.type==="tf") return ans==="true" || ans===true ? "True" : "False";
  if(q.type==="multi") return escapeHtml((ans||[]).join(", "));
  if(q.type==="fill") return escapeHtml((ans||[]).join(", "));
  if(q.type==="classify") return escapeHtml(q.items.map(i=>`${i}: ${ans[i]||"—"}`).join(", "));
  return escapeHtml(ans);
}
function formatCorrect(q){
  if(q.type==="tf") return q.answer ? "True" : "False";
  if(q.type==="multi") return q.answer.join(", ");
  if(q.type==="fill") return q.answer.join(", ");
  if(q.type==="classify") return q.items.map(i=>`${i}: ${q.answer[i]}`).join(", ");
  if(q.type==="short") return q.answer[0];
  return q.answer;
}

/* =========================================================================
   PART 7: START THE APP
   ========================================================================= */
renderIntro();
</script>
