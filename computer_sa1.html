<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Computer SA1 Practice Quiz — Class 3</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF6FB; --card:#FFFFFF; --ink:#173247; --ink-soft:#4C6478;
    --brand:#FF6B4A; --brand-dark:#E1502E; --teal:#1E8A99;
    --good:#2FA86A; --good-bg:#E5F7EC; --bad:#D64550; --bad-bg:#FCEAEA;
    --sun:#FFC145; --line:#DCEBF0;
    --font-head:'Baloo 2','Comic Sans MS', system-ui, sans-serif;
    --font-body:'Nunito', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1B24; --card:#182833; --ink:#EAF3F8; --ink-soft:#A9C0CE;
      --line:#25404D; --good-bg:#173626; --bad-bg:#3A1E21;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1B24; --card:#182833; --ink:#EAF3F8; --ink-soft:#A9C0CE;
    --line:#25404D; --good-bg:#173626; --bad-bg:#3A1E21;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.55; }
  .wrap{ max-width:680px; margin:0 auto; padding:20px 16px 70px; }
  h1,h2,h3{ font-family:var(--font-head); margin:0 0 8px; line-height:1.2; }
  h1{ font-size:1.6rem; color:var(--brand-dark); }
  h2{ font-size:1.25rem; }
  p{ margin:0 0 12px; color:var(--ink-soft); }
  .top{ text-align:center; padding:18px 0 6px; }
  .top .mascot{ font-size:2.4rem; }
  .card{ background:var(--card); border-radius:18px; padding:20px; box-shadow:0 6px 18px rgba(23,50,71,0.08); border:1px solid var(--line); margin-bottom:16px; }
  .btn{ font-family:var(--font-head); font-size:1rem; font-weight:700; border:none; border-radius:14px; padding:13px 20px; cursor:pointer; display:inline-block; text-align:center; transition:transform .08s ease; }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--brand); color:#fff; }
  .btn-primary:hover{ background:var(--brand-dark); }
  .btn-ghost{ background:transparent; color:var(--teal); border:2px solid var(--teal); }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .btn-full{ width:100%; }
  .badge{ display:inline-block; background:var(--sun); color:#5A3E00; font-family:var(--font-head); font-weight:700; font-size:0.78rem; padding:4px 12px; border-radius:999px; margin-bottom:10px; }
  .progress-track{ height:10px; background:var(--line); border-radius:999px; overflow:hidden; margin:10px 0 4px; }
  .progress-fill{ height:100%; background:var(--brand); border-radius:999px; transition:width .25s ease; }
  .progress-label{ font-size:0.85rem; color:var(--ink-soft); }
  .option-btn{ display:block; width:100%; text-align:left; background:var(--bg); border:2px solid var(--line); border-radius:14px; padding:13px 16px; margin-bottom:10px; font-family:var(--font-body); font-size:1rem; color:var(--ink); cursor:pointer; }
  .option-btn.selected{ border-color:var(--brand); background:#FFEFE9; }
  :root[data-theme="dark"] .option-btn.selected{ background:#3A2A22; }
  @media (prefers-color-scheme:dark){ .option-btn.selected{ background:#3A2A22; } }
  textarea{ font-family:var(--font-body); font-size:1rem; padding:11px 12px; border:2px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); width:100%; resize:vertical; min-height:110px; }
  details{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:12px; }
  summary{ font-family:var(--font-head); font-weight:700; cursor:pointer; font-size:1.05rem; }
  .qa{ border-top:1px solid var(--line); padding:12px 0; }
  .qa:first-of-type{ border-top:none; }
  .qa .prompt{ font-weight:700; color:var(--ink); margin-bottom:4px; }
  .tag{ display:inline-block; font-size:0.78rem; font-weight:800; border-radius:8px; padding:2px 9px; margin-right:6px; }
  .tag.good{ background:var(--good-bg); color:var(--good); }
  .tag.bad{ background:var(--bad-bg); color:var(--bad); }
  .tag.note{ background:var(--line); color:var(--ink-soft); }
  .explain{ font-size:0.92rem; color:var(--ink-soft); margin-top:4px; }
  .score-big{ font-family:var(--font-head); font-size:2.4rem; color:var(--brand); text-align:center; margin:6px 0; }
  .score-msg{ text-align:center; font-weight:700; color:var(--ink); }
  .cat-bar-row{ margin-bottom:12px; }
  .cat-bar-row .label{ display:flex; justify-content:space-between; font-size:0.9rem; font-weight:700; margin-bottom:4px; }
  .cat-track{ height:12px; background:var(--line); border-radius:999px; overflow:hidden; }
  .cat-fill{ height:100%; background:var(--teal); border-radius:999px; }
  .session-box{ background:var(--good-bg); border:2px dashed var(--good); border-radius:14px; padding:14px; margin-bottom:16px; }
  .code-chip{ font-family:var(--font-head); font-size:1.3rem; letter-spacing:3px; background:var(--card); border:2px solid var(--brand); color:var(--brand-dark); padding:6px 14px; border-radius:10px; display:inline-block; margin:6px 0; }
  .hint-box{ background:#FFF9E6; border-left:4px solid var(--sun); border-radius:8px; padding:10px 12px; margin-top:10px; font-size:0.9rem; color:#7F6C00; }
  :root[data-theme="dark"] .hint-box{ background:#3A3010; color:#F0D878; }
  @media (prefers-color-scheme:dark){ .hint-box{ background:#3A3010; color:#F0D878; } }
  .hint-btn{ background:transparent; border:none; color:var(--teal); font-weight:700; cursor:pointer; font-family:var(--font-head); font-size:0.95rem; padding:4px 0; }
  .sample-box{ background:var(--good-bg); border-left:4px solid var(--good); border-radius:8px; padding:10px 12px; margin-top:10px; font-size:0.9rem; white-space:pre-wrap; }
  ul.simple{ padding-left:20px; color:var(--ink-soft); }
  ul.simple li{ margin-bottom:6px; }
  .foot-note{ text-align:center; font-size:0.8rem; color:var(--ink-soft); margin-top:24px; }
  .back-link{ display:block; text-align:center; color:var(--teal); text-decoration:none; font-size:0.9rem; margin-bottom:8px; }
  .back-link:hover{ text-decoration:underline; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const QUESTIONS = [
  { id:"c1", cat:"School Newsletter", type:"mcq", prompt:"In Unit 2, which software will we use to create the school newsletter?", options:["LibreOffice Writer", "MS Paint", "Scratch", "Calculator"], answer:"LibreOffice Writer", hint:"It is a word processor from LibreOffice.", explain:"The book tells us we will use LibreOffice Writer, which is a word processor, to create our school newsletter." },
  { id:"c2", cat:"School Newsletter", type:"mcq", prompt:"Which of these is NOT a learning outcome of Unit 2 (School Newsletter)?", options:["Create and format a document using a word processor", "Add images, shapes, and colours to a document", "Create a newsletter for the school's sports week", "Build a food chain using Motion blocks"], answer:"Build a food chain using Motion blocks", hint:"One option belongs to a different unit about the underwater world.", explain:"Building a food chain using Motion blocks is a Unit 4 (Underwater Mission) outcome. Unit 2 is about creating a newsletter using a word processor." },
  { id:"c3", cat:"School Newsletter", type:"mcq", prompt:"Which of these is a feature of a newsletter?", options:["It only has plain text with no images", "Images and logos make it look attractive", "It has no sections", "It is always black and white"], answer:"Images and logos make it look attractive", hint:"Think about what makes a newsletter look nice and colourful.", explain:"A newsletter uses images, logos, and separate sections to make it attractive and easy to read." },
  { id:"c4", cat:"School Newsletter", type:"mcq", prompt:"The newsletter in the book is being designed for which school event?", options:["Annual Day", "Science Fair", "Annual Sports Week", "Teacher's Day"], answer:"Annual Sports Week", hint:"The event is about running, racing, and games.", explain:"The school is celebrating its annual sports week, and the newsletter is being designed for this occasion." },
  { id:"c5", cat:"School Newsletter", type:"mcq", prompt:"Which of these activities is a part of a school's annual sports week?", options:["Watering plants", "Running race", "Two friends talking", "Sleeping"], answer:"Running race", hint:"Sports means games and racing.", explain:"Running race, skipping, throwing games, and football are sports activities. Watering plants or talking are not sports events." },
  { id:"c6", cat:"School Newsletter", type:"mcq", prompt:"Which of the following is a main part of a newsletter?", options:["Keyboard", "Logo, Title, Banner, Image, Content", "Mouse pointer", "Printer"], answer:"Logo, Title, Banner, Image, Content", hint:"These are things we see on the newsletter page.", explain:"A newsletter has parts like Logo, Title, Banner, Image, and Content. These together make the newsletter look complete." },
  { id:"c7", cat:"School Newsletter", type:"mcq", prompt:"Which of these is a benefit of playing sports?", options:["It makes us lazy", "It makes us healthy and gives us energy", "It wastes our time", "It only helps watch TV"], answer:"It makes us healthy and gives us energy", hint:"Sports is good for our body and health.", explain:"Sports help us improve our health, physical strength, and give us energy. They also teach us teamwork." },
  { id:"c8", cat:"School Newsletter", type:"mcq", prompt:"Which of these font styles are available in LibreOffice Writer? (Select all correct) (Select ALL correct — the answer here is the combined set)", options:["Bold", "Regular", "Italics", "Bold and Italics", "All: Bold + Regular + Italics + Bold and Italics"], answer:"All: Bold + Regular + Italics + Bold and Italics", hint:"All four options are correct — Writer has many font styles.", explain:"LibreOffice Writer gives us all four font styles: Bold, Regular, Italics, and Bold and Italics. We can use them to make our text look different." },
  { id:"c9", cat:"School Newsletter", type:"mcq", prompt:"Which parts of a newsletter should have a bigger font size?", options:["The whole paragraph", "The title and the headings", "The small notes", "Nothing should be big"], answer:"The title and the headings", hint:"Important things like the title are written bigger.", explain:"The title and headings of a newsletter should have a bigger font size. Bigger text catches the reader's attention." },
  { id:"c10", cat:"School Newsletter", type:"mcq", prompt:"Which of these fonts is easier to read in a newsletter?", options:["A plain simple font like Times New Roman or Arial", "Many different fancy fonts in one sentence", "Only typewriter-style font", "A font that looks like handwriting with curves"], answer:"A plain simple font like Times New Roman or Arial", hint:"Which one would you find easiest to read in a book?", explain:"Simple fonts like Times New Roman and Arial are easier to read. Fancy or typewriter fonts can be hard to read." },
  { id:"c11", cat:"School Newsletter", type:"mcq", prompt:"According to the Quick Tips, how many types of fonts should you use on the same page?", options:["Not more than four", "Exactly ten", "As many as possible", "Only one, no more"], answer:"Not more than four", hint:"A small number — less than five.", explain:"The book says we should not use more than four types of fonts on the same page. Too many fonts make the page look messy." },
  { id:"c12", cat:"School Newsletter", type:"mcq", prompt:"To highlight text in a document, we can use:", options:["Bold, Italics, or Underline", "Only shapes", "Only pictures", "Only numbers"], answer:"Bold, Italics, or Underline", hint:"Think about Ctrl+B, Ctrl+I, Ctrl+U keyboard shortcuts.", explain:"To highlight (make something stand out) in a document, we use Bold, Italics, or Underline formatting." },
  { id:"c13", cat:"School Newsletter", type:"mcq", prompt:"From the words: edit, copy, paste, cut, save — which words are shown in BOLD style?", options:["edit and paste", "copy and cut", "save only", "all five words"], answer:"copy and cut", hint:"Bold letters look thicker and darker than normal.", explain:"In the book, the words 'copy' and 'cut' are shown in bold style (thick dark letters). Bold makes text look thicker and darker." },
  { id:"c14", cat:"School Newsletter", type:"mcq", prompt:"From the words: print, open, close, edit, new — which words are in ITALICS style?", options:["open, close, edit", "print and new", "only edit", "none of them"], answer:"open, close, edit", hint:"Italics letters look like they are leaning to the right.", explain:"In italic style, the letters are slanted (tilted to the right). The words 'open', 'close', and 'edit' are shown in italics." },
  { id:"c15", cat:"School Newsletter", type:"mcq", prompt:"From the words: red, blue, purple, grey, white — which words are NOT underlined?", options:["red and grey", "blue and white", "purple only", "all are underlined"], answer:"blue and white", hint:"Underlined means a line is drawn below the word.", explain:"The words 'blue' and 'white' do not have a line below them. The other words (red, purple, grey) are underlined." },
  { id:"c16", cat:"School Newsletter", type:"mcq", prompt:"From the words: summer, autumn, winter, spring, monsoon — which words have the SAME font size?", options:["summer, autumn, spring", "winter and monsoon", "monsoon only", "all of them"], answer:"summer, autumn, spring", hint:"Three words look the same size. One looks much bigger.", explain:"In the book, 'summer', 'autumn', and 'spring' are all written in the same (smaller) font size. 'monsoon' is bigger." },
  { id:"c17", cat:"School Newsletter", type:"tf", prompt:"True or False: Regular font should be used to highlight a word.", answer:false, hint:"Regular font is plain. Does plain text stand out?", explain:"False. Regular font is the normal font. To highlight a word, we use Bold, Italics, or Underline — not Regular." },
  { id:"c18", cat:"School Newsletter", type:"tf", prompt:"True or False: Larger fonts catch the readers' attention.", answer:true, hint:"Big words are easier to see than small ones.", explain:"True. Bigger letters are easier to notice. That is why titles and important text are made larger." },
  { id:"c19", cat:"School Newsletter", type:"tf", prompt:"True or False: Using different fonts in the same sentence makes it easier to read.", answer:false, hint:"Would you like to read a sentence where every word looks different?", explain:"False. Using many different fonts in one sentence makes it harder to read, not easier. We should stick to one or two fonts." },
  { id:"c20", cat:"School Newsletter", type:"tf", prompt:"True or False: Bold, italics, and underline should not be used often in a document.", answer:true, hint:"Highlighting works only when it is used a little.", explain:"True. These styles are for highlighting special words. If used too much, nothing looks special anymore." },
  { id:"c21", cat:"School Newsletter", type:"mcq", prompt:"Which word is an example of BOLD text?", options:["Earth", "Moon", "Sun", "Star"], answer:"Earth", hint:"Which word looks the darkest and thickest?", explain:"The word 'Earth' is written in bold (thick) letters in the book, so it is an example of bold text." },
  { id:"c22", cat:"School Newsletter", type:"mcq", prompt:"Which word is an example of UNDERLINED text?", options:["Earth", "Moon", "Sun", "Mars"], answer:"Sun", hint:"Look for the word with a line under it.", explain:"The word 'Sun' has a line below it (Sun), so it is an example of underlined text." },
  { id:"c23", cat:"School Newsletter", type:"mcq", prompt:"Which word is an example of ITALIC text?", options:["Earth", "Moon", "Sun", "Star"], answer:"Moon", hint:"Italic text looks slanted or leaning.", explain:"The word 'Moon' is slanted (tilted) in the book, so it is an example of italic text." },
  { id:"c24", cat:"School Newsletter", type:"mcq", prompt:"What is the keyboard shortcut to make text BOLD?", options:["Ctrl + B", "Ctrl + I", "Ctrl + U", "Ctrl + S"], answer:"Ctrl + B", hint:"B is the first letter of 'Bold'.", explain:"Ctrl + B is the shortcut for Bold. 'B' stands for Bold. Ctrl + I is for Italic and Ctrl + U is for Underline." },
  { id:"c25", cat:"School Newsletter", type:"mcq", prompt:"In the carnival image, the names of three rides are Roller coaster, Pirate ship and Merry-go-round. Why should each be written in a different font style?", options:["To save paper", "To make them look different and attractive", "Because the computer forces us to", "To make them hard to read"], answer:"To make them look different and attractive", hint:"Different fonts make things look interesting.", explain:"Different font styles make each name look different and attractive. This is useful in posters and newsletters." },
  { id:"c26", cat:"Class Calendar Chronicle", type:"mcq", prompt:"What is a chronicle?", options:["A type of computer", "A record of events in the order they happened", "A kind of printer", "A chair in the classroom"], answer:"A record of events in the order they happened", hint:"It is a special kind of record arranged by date.", explain:"A chronicle is a record of events that took place in the past, arranged in the order they happened. This order is called chronological order." },
  { id:"c27", cat:"Class Calendar Chronicle", type:"mcq", prompt:"The order in which events happened one after another is called:", options:["Alphabetical order", "Chronological order", "Random order", "Shape order"], answer:"Chronological order", hint:"The word is close to the word 'chronicle'.", explain:"Chronological order means arranging events by the date and time they happened. A chronicle uses chronological order." },
  { id:"c28", cat:"Class Calendar Chronicle", type:"mcq", prompt:"What information does a student directory contain?", options:["Only the student's favourite food", "Names, phone numbers, and addresses of the students", "Only pictures of the school", "The timetable only"], answer:"Names, phone numbers, and addresses of the students", hint:"Think of a phone book, but for students.", explain:"A student directory keeps information such as names, phone numbers, and addresses so classmates can contact each other easily." },
  { id:"c29", cat:"Class Calendar Chronicle", type:"mcq", prompt:"A table is made up of:", options:["Lines and curves", "Rows and columns", "Only pictures", "Only numbers"], answer:"Rows and columns", hint:"One goes side-to-side and the other goes up-and-down.", explain:"A table is made up of rows (going across) and columns (going down). The small boxes are called cells." },
  { id:"c30", cat:"Class Calendar Chronicle", type:"mcq", prompt:"Which of these is NOT a use of a table?", options:["Arranging information in rows and columns", "Finding information easily", "Comparing different information", "Playing music"], answer:"Playing music", hint:"Tables help us with information, not sound.", explain:"Tables are used to arrange, compare, and find information. Playing music is not what a table is used for." },
  { id:"c31", cat:"Class Calendar Chronicle", type:"mcq", prompt:"If there are 35 students in a class and you record 3 points of information for each, how many rows and columns are needed?", options:["35 rows and 3 columns", "3 rows and 35 columns", "35 rows and 35 columns", "3 rows and 3 columns"], answer:"35 rows and 3 columns", hint:"Each student gets one row. Each piece of info gets one column.", explain:"One row for each student (35 rows). One column for each point of information (3 columns). So we need 35 rows and 3 columns." },
  { id:"c32", cat:"Class Calendar Chronicle", type:"mcq", prompt:"The colours of the rainbow (VIBGYOR) are:", options:["Violet, Indigo, Blue, Green, Yellow, Orange, Red", "Red, Pink, White, Black, Grey, Brown, Gold", "Blue, Blue, Green, Green, Red, Red, Yellow", "Only Red and Blue"], answer:"Violet, Indigo, Blue, Green, Yellow, Orange, Red", hint:"Each letter in VIBGYOR is the first letter of one rainbow colour.", explain:"VIBGYOR stands for Violet, Indigo, Blue, Green, Yellow, Orange, Red — the seven colours of the rainbow." },
  { id:"c33", cat:"Class Calendar Chronicle", type:"mcq", prompt:"If 15 students wash utensils, 15 clean the house, 20 water plants, and 10 cook food, what is the total number of students who help their parents?", options:["40", "50", "60", "70"], answer:"60", hint:"Add all four numbers together.", explain:"15 + 15 + 20 + 10 = 60. So 60 students help their parents with household activities." },
  { id:"c34", cat:"Class Calendar Chronicle", type:"mcq", prompt:"When should we use a numbered list instead of a bulleted list?", options:["When the order of items is important", "When we have only one item", "When we want to draw a picture", "Never"], answer:"When the order of items is important", hint:"Numbers show which comes first, second, third.", explain:"A numbered list is used when the order of items matters, like steps 1, 2, 3. A bulleted list is used when the order does not matter." },
  { id:"c35", cat:"Class Calendar Chronicle", type:"mcq", prompt:"A list of flags of different countries would be shown as a:", options:["Bulleted list", "Numbered list", "Table of contents", "Chart"], answer:"Bulleted list", hint:"Does it matter which flag is listed first?", explain:"The order of countries does not matter in this list, so a bulleted list is used." },
  { id:"c36", cat:"Class Calendar Chronicle", type:"mcq", prompt:"A dictionary, a to-do list, and the contents of a book are examples of which type of list?", options:["Bulleted list", "Numbered list", "Picture list", "Mixed list"], answer:"Numbered list", hint:"In each of these, the order matters.", explain:"A dictionary (alphabetical order), a to-do list (order of tasks), and a book's contents (chapter order) all have a fixed order, so they are numbered lists." },
  { id:"c37", cat:"Class Calendar Chronicle", type:"mcq", prompt:"The planets in our solar system (Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune) are listed as a:", options:["Bulleted list", "Numbered list", "Random list", "Shopping list"], answer:"Numbered list", hint:"Mercury is closest to the Sun, so the order is important.", explain:"Planets are listed in the order of their distance from the Sun, so this is a numbered list where the order matters." },
  { id:"c38", cat:"Class Calendar Chronicle", type:"mcq", prompt:"In the sample timetable in the book, what is the second period on Tuesday?", options:["Maths", "CCS", "Art", "Science"], answer:"CCS", hint:"Find the Tuesday row and look at the second column.", explain:"Looking at the timetable, Tuesday's second period is CCS. We read the row for Tuesday and find the second column." },
  { id:"c39", cat:"Class Calendar Chronicle", type:"mcq", prompt:"How many rows does the timetable have (for weekdays Monday to Friday)?", options:["3", "4", "5", "6"], answer:"5", hint:"Count the weekdays: Mon, Tue, Wed, Thu, Fri.", explain:"Monday, Tuesday, Wednesday, Thursday, Friday — that is 5 rows (one for each weekday)." },
  { id:"c40", cat:"Class Calendar Chronicle", type:"mcq", prompt:"How many periods are there in a day according to the sample timetable?", options:["6", "7", "8", "9"], answer:"8", hint:"Count the numbers at the top of the timetable.", explain:"The timetable shows 8 periods in a day, numbered 1 to 8." },
  { id:"c41", cat:"Class Calendar Chronicle", type:"mcq", prompt:"How many columns does the timetable have?", options:["7", "8", "9", "10"], answer:"9", hint:"Don't forget the first column for the day names.", explain:"The timetable has 9 columns in total — 1 column for the day name, and 8 columns for the 8 periods." },
  { id:"c42", cat:"Class Calendar Chronicle", type:"tf", prompt:"True or False: Adding bullets and numbering makes a document easy to read.", answer:true, hint:"Think about a shopping list without bullets — would it be clear?", explain:"True. Bullets and numbers make the points separate and clear, so the document becomes easy to read." },
  { id:"c43", cat:"Class Calendar Chronicle", type:"tf", prompt:"True or False: Tables help you carry your files anywhere and use them on another computer.", answer:false, hint:"A table is for organising info, not for moving files.", explain:"False. Tables are used to organise information, not to carry files. For carrying files, we use pen drives or email." },
  { id:"c44", cat:"Class Calendar Chronicle", type:"tf", prompt:"True or False: Tables help you organise a document.", answer:true, hint:"Rows and columns = organised information.", explain:"True. Tables arrange information in rows and columns, making the document neat and organised." },
  { id:"c45", cat:"Class Calendar Chronicle", type:"tf", prompt:"True or False: The best way to list the names of students in a class is using a bulleted list.", answer:false, hint:"Roll numbers already give an order.", explain:"False. Student names are listed by roll number, so a numbered list is better than a bulleted list." },
  { id:"c46", cat:"Class Calendar Chronicle", type:"mcq", prompt:"A list that uses dots (•, ◆, ■) instead of numbers is called a:", options:["Numbered list", "Bulleted list", "Table", "Chart"], answer:"Bulleted list", hint:"Dots or shapes = bulleted.", explain:"A bulleted list uses dots or small shapes to show each item. A numbered list uses 1, 2, 3 and so on." },
  { id:"c47", cat:"Class Calendar Chronicle", type:"mcq", prompt:"Which of these is a PERCUSSION instrument (beaten with hands or sticks to make sound)?", options:["Guitar", "Violin", "Drums", "Flute"], answer:"Drums", hint:"You hit it to make sound.", explain:"Drums are percussion instruments because we beat them with hands or sticks to make sound. Xylophone and Bongo are also percussion." },
  { id:"c48", cat:"Class Calendar Chronicle", type:"mcq", prompt:"Which of these is a STRING instrument (has strings played by hand)?", options:["Drums", "Xylophone", "Bongo", "Guitar"], answer:"Guitar", hint:"It has strings you pluck with your fingers.", explain:"Guitar is a string instrument because it has strings that are played by hand. Violin is another example of a string instrument." },
  { id:"c49", cat:"Underwater Mission", type:"mcq", prompt:"In Unit 4, which software will we use to create the underwater projects?", options:["LibreOffice Writer", "ScratchJr", "MS Word", "Paint"], answer:"ScratchJr", hint:"Its name has 'Scratch' and 'Jr' (short for Junior).", explain:"ScratchJr is used in Unit 4 to create projects like the underwater food chain and treasure hunt." },
  { id:"c50", cat:"Underwater Mission", type:"mcq", prompt:"What is a food chain?", options:["A chain of restaurants", "A chain of organisms where one feeds on another in a specific order", "A chain made of gold", "A dance step"], answer:"A chain of organisms where one feeds on another in a specific order", hint:"Think about who eats whom in nature.", explain:"A food chain shows how living things eat each other for food, like Grass → Zebra → Lion." },
  { id:"c51", cat:"Underwater Mission", type:"mcq", prompt:"Which block should we use to help the whale reach the fish (move it sideways)?", options:["Move Right", "Hide", "Repeat Forever", "Stop"], answer:"Move Right", hint:"To move sideways, we use a motion block.", explain:"The Move Right block moves the character to the right, which can help the whale reach the fish." },
  { id:"c52", cat:"Underwater Mission", type:"mcq", prompt:"In the underwater food pyramid, who eats the seaweeds first?", options:["Whales", "Sharks", "Small fishes", "Big fishes"], answer:"Small fishes", hint:"The smallest animals eat the plants first.", explain:"Small fishes eat the seaweeds. Then big fishes eat small fishes, and whales/sharks eat the big fishes." },

  { id:"c79", cat:"Class Calendar Chronicle", type:"long", prompt:"What is the difference between a bulleted list and a numbered list? Give one example of each.", sample:"A bulleted list uses small dots (•) or shapes before each item. We use it when the order of items does NOT matter.\nExample: A shopping list (bread, milk, eggs).\n\nA numbered list uses numbers (1, 2, 3) before each item. We use it when the order DOES matter.\nExample: A to-do list or the steps to make a sandwich.", hint:"One uses dots, the other uses numbers.", explain:"Bulleted lists use dots when order does not matter. Numbered lists use numbers when the order of items matters." },

  { id:"c81", cat:"Underwater Mission", type:"long", prompt:"What is a food chain? Give one example of a food chain.", sample:"A food chain is a chain of living things (organisms) where one feeds on another in a specific order. It shows who eats whom in nature.\n\nExample of a food chain on land:\nGrass → Zebra → Lion\n(The zebra eats grass, and the lion eats the zebra.)", hint:"Think about who eats what in the jungle.", explain:"A food chain shows how living things eat each other. For example: Grass → Zebra → Lion. The arrow shows the energy flow." },
  { id:"c82", cat:"Underwater Mission", type:"long", prompt:"Explain the underwater food chain using the marine food pyramid.", sample:"The underwater food chain works like this:\n1. Small fishes eat seaweeds (water plants).\n2. Big fishes eat the small fishes.\n3. Whales and sharks eat the big fishes.\n\nSo the food chain is: Seaweeds → Small fishes → Big fishes → Whales/Sharks.", hint:"Start with plants and end with the biggest sea animal.", explain:"Underwater food chain: seaweeds → small fish → big fish → whales/sharks. The smallest animal eats plants, and bigger animals eat smaller ones." },

const CATEGORY_ORDER = [
  "School Newsletter",
  "Class Calendar Chronicle",
  "Underwater Mission",
  "Space Explorer"
];

const STORAGE_KEY = "computerSA1QuizSession";
function makeCode(){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let code = ""; for(let i=0;i<6;i++){ code += chars[Math.floor(Math.random()*chars.length)]; }
  return code;
}
function saveSession(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function loadSession(){ try{ const r = localStorage.getItem(STORAGE_KEY); return r?JSON.parse(r):null; }catch(e){ return null; } }

let state = { code:null, index:0, answers:{}, hintsShown:{}, samplesShown:{}, submitted:false };
const app = document.getElementById("app");

function escapeHtml(s){
  if(s===undefined || s===null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function checkAnswer(q, ans){
  switch(q.type){
    case "mcq": return { score:(ans===q.answer)?1:0, max:1 };
    case "tf":  return { score:((ans===true||ans==="true")===q.answer)?1:0, max:1 };
    case "long": return null;
  }
  return null;
}

function collectCurrentAnswer(q){
  if(q.type==="mcq" || q.type==="tf"){
    const el = document.querySelector('input[name="r-'+q.id+'"]:checked');
    return el ? el.value : null;
  }
  if(q.type==="long"){
    const el = document.getElementById("t-"+q.id);
    return el ? el.value : "";
  }
  return null;
}

function renderIntro(){
  const saved = loadSession();
  let banner = "";
  if(saved && saved.code){
    if(saved.submitted){
      banner = `<div class="session-box">
        <strong>Welcome back! 🎉</strong><br>
        You already finished this quiz (code <span class="code-chip">${saved.code}</span>).
        <div class="btn-row">
          <button class="btn btn-primary" onclick="reopenResults()">👀 See My Results Again</button>
          <button class="btn btn-ghost" onclick="startFresh()">🔄 Take It Again</button>
        </div>
      </div>`;
    } else {
      banner = `<div class="session-box">
        <strong>We found a saved quiz in progress!</strong><br>
        Your code is <span class="code-chip">${saved.code}</span> — Question ${saved.index+1} of ${QUESTIONS.length}.
        <div class="btn-row">
          <button class="btn btn-primary" onclick="resumeSession()">▶ Resume Quiz</button>
          <button class="btn btn-ghost" onclick="startFresh()">🔄 Start Fresh</button>
        </div>
      </div>`;
    }
  }
  app.innerHTML = `
    <a href="index.html" class="back-link">⬅ Back to all quizzes</a>
    <div class="top">
      <div class="mascot">💻🚀</div>
      <h1>Computer SA1 Practice Quiz</h1>
      <p>Class 3 • Units 2 to 5 • ${QUESTIONS.length} Questions</p>
    </div>
    ${banner}
    <div class="card">
      <h2>Before you start</h2>
      <p>There are <strong>${QUESTIONS.length} questions</strong> covering School Newsletter, Class Calendar Chronicle, Underwater Mission, and Space Explorer.</p>
      <p>Some are MCQ, some True/False, and some are long-answer questions where you write in your own words and compare with a sample.</p>
      <p>When you click Start, you'll get a <strong>6-letter Session Code</strong>. Write it down! If the quiz gets interrupted, come back and use the code to pick up where you left off (same device/browser).</p>
      <button class="btn btn-primary btn-full" onclick="startFresh()">🚀 Start the Quiz</button>
    </div>
    <div class="card">
      <h3>Have a rejoin code?</h3>
      <div style="display:flex; gap:8px;">
        <input type="text" id="rejoin-input" placeholder="e.g. AB3X9K" maxlength="6" style="text-transform:uppercase; padding:11px 12px; border:2px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); width:100%; font-family:var(--font-body); font-size:1rem;">
        <button class="btn btn-ghost" onclick="tryRejoin()">Go</button>
      </div>
      <p id="rejoin-msg" style="margin-top:8px;"></p>
    </div>
  `;
}

function tryRejoin(){
  const typed = document.getElementById("rejoin-input").value.trim().toUpperCase();
  const saved = loadSession();
  const msg = document.getElementById("rejoin-msg");
  if(saved && saved.code === typed){
    if(saved.submitted){ reopenResults(); } else { resumeSession(); }
  } else {
    msg.textContent = "We couldn't find that code on this device. Codes only work on the same device/browser you started on.";
    msg.style.color = "var(--bad)";
  }
}

function startFresh(){
  state = { code:makeCode(), index:0, answers:{}, hintsShown:{}, samplesShown:{}, submitted:false };
  saveSession(); renderQuiz();
}
function resumeSession(){
  const s=loadSession();
  if(s){ state=s; if(!state.hintsShown) state.hintsShown={}; if(!state.samplesShown) state.samplesShown={}; }
  renderQuiz();
}
function reopenResults(){ const s=loadSession(); if(s){ state=s; } renderResults(); }

function renderQuiz(){
  const q = QUESTIONS[state.index];
  const pct = Math.round((state.index)/QUESTIONS.length*100);
  let body = "";
  if(q.type==="mcq" || q.type==="tf"){
    const opts = q.type==="tf" ? ["True","False"] : q.options;
    const sv = state.answers[q.id];
    body = opts.map(opt=>{
      const val = q.type==="tf" ? (opt==="True"?"true":"false") : opt;
      const checked = sv===val ? "checked" : "";
      return `<label class="option-btn ${sv===val?'selected':''}">
                <input type="radio" name="r-${q.id}" value="${escapeHtml(val)}" ${checked} style="margin-right:8px;" onchange="onAnswerChange('${q.id}')">
                ${escapeHtml(opt)}
              </label>`;
    }).join("");
  } else if(q.type==="long"){
    const v = state.answers[q.id] || "";
    body = `<textarea id="t-${q.id}" placeholder="Write your answer here in your own words..." oninput="onLongChange('${q.id}')">${escapeHtml(v)}</textarea>`;
  }
  const isLast = state.index === QUESTIONS.length - 1;
  const hs = state.hintsShown && state.hintsShown[q.id];
  const ss = state.samplesShown && state.samplesShown[q.id];
  const sampleBtn = q.type==="long" ? `<button class="hint-btn" onclick="toggleSample('${q.id}')" style="margin-left:10px;">👀 ${ss?'Hide':'Show'} Sample Answer</button>` : "";
  const sampleBox = q.type==="long" ? `<div class="sample-box" style="display:${ss?'block':'none'};"><strong>Sample Answer:</strong>\n${escapeHtml(q.sample)}</div>` : "";

  app.innerHTML = `
    <div class="top" style="text-align:left; display:flex; justify-content:space-between; align-items:center;">
      <span class="progress-label">Question ${state.index+1} of ${QUESTIONS.length}</span>
      <span class="progress-label">Code: <strong>${state.code}</strong></span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card">
      <span class="badge">${escapeHtml(q.cat)}</span>
      <h2>${escapeHtml(q.prompt)}</h2>
      ${body}
      <div>
        <button class="hint-btn" onclick="toggleHint('${q.id}')">💡 ${hs?'Hide':'Show'} Hint</button>
        ${sampleBtn}
      </div>
      <div class="hint-box" style="display:${hs?'block':'none'};">💡 ${escapeHtml(q.hint)}</div>
      ${sampleBox}
    </div>
    <div class="btn-row">
      ${state.index>0 ? `<button class="btn btn-ghost" onclick="goTo(${state.index-1})">← Back</button>` : ""}
      <button class="btn btn-primary" onclick="goNext()">${isLast ? "🏁 See My Results" : "Next →"}</button>
    </div>
    <p class="foot-note">Your progress is saved automatically on this device.</p>
  `;
}

function onAnswerChange(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  state.answers[qid] = collectCurrentAnswer(q);
  saveSession(); renderQuiz();
}
function onLongChange(qid){
  const q = QUESTIONS.find(x=>x.id===qid);
  state.answers[qid] = collectCurrentAnswer(q);
  saveSession();
}
function toggleHint(qid){
  if(!state.hintsShown) state.hintsShown = {};
  state.hintsShown[qid] = !state.hintsShown[qid];
  const q = QUESTIONS.find(x=>x.id===qid);
  const cur = collectCurrentAnswer(q);
  if(cur !== null) state.answers[qid] = cur;
  saveSession(); renderQuiz();
}
function toggleSample(qid){
  if(!state.samplesShown) state.samplesShown = {};
  state.samplesShown[qid] = !state.samplesShown[qid];
  const q = QUESTIONS.find(x=>x.id===qid);
  const cur = collectCurrentAnswer(q);
  if(cur !== null) state.answers[qid] = cur;
  saveSession(); renderQuiz();
}
function goTo(i){
  const q = QUESTIONS[state.index];
  state.answers[q.id] = collectCurrentAnswer(q);
  state.index = i; saveSession(); renderQuiz();
}
function goNext(){
  const q = QUESTIONS[state.index];
  state.answers[q.id] = collectCurrentAnswer(q);
  if(state.index < QUESTIONS.length-1){ state.index++; saveSession(); renderQuiz(); }
  else { submitQuiz(); }
}
function submitQuiz(){ state.submitted=true; saveSession(); renderResults(); }

function renderResults(){
  const catTotals = {};
  CATEGORY_ORDER.forEach(c=>catTotals[c]={score:0,max:0});
  let total=0, max=0;
  QUESTIONS.forEach(q=>{
    const r = checkAnswer(q, state.answers[q.id]);
    if(r){ catTotals[q.cat].score+=r.score; catTotals[q.cat].max+=r.max; total+=r.score; max+=r.max; }
  });
  const pct = max ? Math.round((total/max)*100) : 0;
  const msg = pct>=90 ? "🌟 Superstar! You really know your computer skills!" :
              pct>=70 ? "🎉 Great job!" :
              pct>=50 ? "👍 Good effort! A little more practice." :
                        "💪 Nice try! Keep practising.";

  const catBars = CATEGORY_ORDER.map(c=>{
    const t = catTotals[c]; if(t.max===0) return "";
    const p = Math.round((t.score/t.max)*100);
    const note = p>=80 ? "Great work here!" : p>=50 ? "Good — a little more practice will help." : "Let's review this together.";
    return `<div class="cat-bar-row">
              <div class="label"><span>${escapeHtml(c)}</span><span>${t.score}/${t.max}</span></div>
              <div class="cat-track"><div class="cat-fill" style="width:${p}%"></div></div>
              <div class="explain">${note}</div>
            </div>`;
  }).join("");

  const answerKey = CATEGORY_ORDER.map(cat=>{
    const qs = QUESTIONS.filter(q=>q.cat===cat); if(qs.length===0) return "";
    const items = qs.map(q=>{
      const r = checkAnswer(q, state.answers[q.id]);
      const ua = formatAnswer(q, state.answers[q.id]);
      const ca = formatCorrect(q);
      let tag = `<span class="tag note">💭 Not answered</span>`;
      if(r){
        if(r.score===r.max) tag = `<span class="tag good">✅ Correct</span>`;
        else if(r.score===0) tag = `<span class="tag bad">❌ Try again</span>`;
      } else if(q.type==="long" && state.answers[q.id]){
        tag = `<span class="tag note">💭 Your answer (compare with sample)</span>`;
      }
      const correctOrSample = q.type==="long"
        ? `<div class="explain"><strong>Sample answer:</strong> ${escapeHtml(q.sample)}</div>`
        : `<div class="explain"><strong>Correct answer:</strong> ${escapeHtml(ca)}</div>`;
      return `<div class="qa">
                <div class="prompt">${escapeHtml(q.prompt)}</div>
                ${tag}
                <div class="explain"><strong>Your answer:</strong> ${ua || "<em>(no answer)</em>"}</div>
                ${correctOrSample}
                <div class="explain">${escapeHtml(q.explain||"")}</div>
              </div>`;
    }).join("");
    return `<details><summary>${escapeHtml(cat)}</summary>${items}</details>`;
  }).join("");

  const longCount = QUESTIONS.filter(q=>q.type==="long").length;
  const longNote = longCount>0 ? `<p style="font-size:0.9rem; color:var(--ink-soft); margin-top:8px;"><em>Note: ${longCount} long-answer questions are not auto-scored. Compare your answers with the samples in the answer key.</em></p>` : "";

  app.innerHTML = `
    <a href="index.html" class="back-link">⬅ Back to all quizzes</a>
    <div class="top"><div class="mascot">🏆</div><h1>Your Results</h1></div>
    <div class="card">
      <div class="score-big">${total} / ${max}</div>
      <div class="score-msg">${pct}% — ${msg}</div>
      ${longNote}
    </div>
    <div class="card">
      <h2>Score by Topic</h2>
      ${catBars}
    </div>
    <div class="card">
      <h2>📖 Full Answer Key &amp; Explanations</h2>
      <p>Tap any topic below to see every question, your answer, and the correct answer.</p>
      ${answerKey}
    </div>
    <div class="btn-row">
      <button class="btn btn-primary btn-full" onclick="startFresh()">🔄 Take the Quiz Again</button>
    </div>
  `;
}
function formatAnswer(q, a){
  if(a===undefined||a===null||a==="") return "";
  if(q.type==="tf") return a==="true"||a===true ? "True" : "False";
  return escapeHtml(a);
}
function formatCorrect(q){
  if(q.type==="tf") return q.answer ? "True" : "False";
  if(q.type==="long") return "";
  return q.answer;
}

renderIntro();
</script>
</body>
</html>
