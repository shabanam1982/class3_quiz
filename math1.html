// ================================================================
// APP STATE
// ================================================================
let currentChapter = 1;
let currentIndex = 0;
let userProgress = {}; // key: globalIndex, value: { answered, scratch, correct }

const chapterNames = [
  "🌟 Numbers", "➕ Addition", "➖ Subtraction", "✖️ Multiplication", "➗ Division",
  "🍕 Fractions", "📐 Geometry", "📏 Measurement", "⏰ Time", "💰 Money", "📊 Data"
];

// DOM refs
const chapterNav = document.getElementById('chapterNav');
const chapterTitle = document.getElementById('chapterTitle');
const qCounter = document.getElementById('qCounter');
const questionText = document.getElementById('questionText');
const qLabel = document.getElementById('qLabel');
const scratchArea = document.getElementById('scratchArea');
const answerInput = document.getElementById('answerInput');
const feedbackText = document.getElementById('feedbackText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const checkBtn = document.getElementById('checkBtn');
const showAnswerBtn = document.getElementById('showAnswerBtn');
const clearScratchBtn = document.getElementById('clearScratchBtn');
const scoreDisplay = document.getElementById('scoreDisplay');

// helpers
function getChapterQuestions(ch) {
  return questionBank.filter(q => q.chapter === ch);
}

function getGlobalIndex(ch, localIdx) {
  const list = getChapterQuestions(ch);
  if (localIdx < 0 || localIdx >= list.length) return -1;
  const target = list[localIdx];
  return questionBank.indexOf(target);
}

function updateScore() {
  let correct = 0, total = 0;
  for (let key in userProgress) {
    total++;
    if (userProgress[key].correct === true) correct++;
  }
  scoreDisplay.textContent = `⭐ ${correct} / ${total}`;
}

function renderQuestion() {
  const list = getChapterQuestions(currentChapter);
  if (list.length === 0) {
    questionText.textContent = 'No questions in this chapter.';
    return;
  }
  const localIdx = Math.min(currentIndex, list.length - 1);
  const globalIdx = getGlobalIndex(currentChapter, localIdx);
  if (globalIdx === -1) return;
  const q = questionBank[globalIdx];

  chapterTitle.textContent = chapterNames[currentChapter - 1];
  qLabel.textContent = `📘 ${q.exercise}`;
  questionText.textContent = q.q;
  qCounter.textContent = `Q${localIdx+1} / ${list.length}`;

  // Restore saved progress
  if (userProgress[globalIdx]) {
    scratchArea.value = userProgress[globalIdx].scratch || '';
    answerInput.value = userProgress[globalIdx].answered || '';
    if (userProgress[globalIdx].correct === true) {
      feedbackText.innerHTML = '✅ Correct! Great job!';
    } else if (userProgress[globalIdx].correct === false) {
      feedbackText.innerHTML = '❌ Not quite. Try again or see answer.';
    } else {
      feedbackText.innerHTML = '📝 Type your answer and click Check.';
    }
  } else {
    scratchArea.value = '';
    answerInput.value = '';
    feedbackText.innerHTML = '📝 Type your answer and click Check.';
  }

  prevBtn.disabled = localIdx === 0;
  nextBtn.disabled = localIdx === list.length - 1;
  updateScore();
}

function checkAnswer() {
  const list = getChapterQuestions(currentChapter);
  const localIdx = Math.min(currentIndex, list.length - 1);
  const globalIdx = getGlobalIndex(currentChapter, localIdx);
  if (globalIdx === -1) return;
  const q = questionBank[globalIdx];
  const userAns = answerInput.value.trim();
  if (!userAns) {
    feedbackText.innerHTML = '✏️ Please type your answer first!';
    return;
  }

  const normalize = s => s.toLowerCase().replace(/\s+/g, ' ').trim();
  const isCorrect = normalize(userAns) === normalize(q.answer);

  if (!userProgress[globalIdx]) userProgress[globalIdx] = {};
  userProgress[globalIdx].answered = userAns;
  userProgress[globalIdx].scratch = scratchArea.value;
  userProgress[globalIdx].correct = isCorrect;

  feedbackText.innerHTML = isCorrect ? '✅ Correct! 🌟 Well done!' : `❌ Oops! The answer is: ${q.answer}`;
  updateScore();
}

function showAnswer() {
  const list = getChapterQuestions(currentChapter);
  const localIdx = Math.min(currentIndex, list.length - 1);
  const globalIdx = getGlobalIndex(currentChapter, localIdx);
  if (globalIdx === -1) return;
  const q = questionBank[globalIdx];
  feedbackText.innerHTML = `💡 Answer: ${q.answer}`;
  if (!userProgress[globalIdx]) userProgress[globalIdx] = {};
  userProgress[globalIdx].shown = true;
}

function navigate(delta) {
  const list = getChapterQuestions(currentChapter);
  if (list.length === 0) return;
  let newIdx = currentIndex + delta;
  if (newIdx < 0) newIdx = 0;
  if (newIdx >= list.length) newIdx = list.length - 1;
  currentIndex = newIdx;
  renderQuestion();
}

function resetProgress() {
  if (confirm('Reset all your progress for this chapter?')) {
    const list = getChapterQuestions(currentChapter);
    list.forEach(q => {
      const idx = questionBank.indexOf(q);
      delete userProgress[idx];
    });
    currentIndex = 0;
    renderQuestion();
    updateScore();
    feedbackText.innerHTML = '🔄 Progress reset for this chapter.';
  }
}

function buildNav() {
  chapterNav.innerHTML = '';
  for (let i = 1; i <= 11; i++) {
    const btn = document.createElement('button');
    btn.className = 'ch-btn' + (i === currentChapter ? ' active' : '');
    btn.textContent = `Ch ${i}`;
    btn.dataset.ch = i;
    btn.addEventListener('click', () => {
      currentChapter = i;
      currentIndex = 0;
      renderQuestion();
      buildNav();
    });
    chapterNav.appendChild(btn);
  }
}

// Events
prevBtn.addEventListener('click', () => navigate(-1));
nextBtn.addEventListener('click', () => navigate(1));
resetBtn.addEventListener('click', resetProgress);
checkBtn.addEventListener('click', checkAnswer);
showAnswerBtn.addEventListener('click', showAnswer);
clearScratchBtn.addEventListener('click', () => { scratchArea.value = ''; });
answerInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') checkAnswer(); });

// Init
buildNav();
renderQuestion();
</script>
